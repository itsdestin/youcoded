<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- WHY this page exists (Destin, 2026-11-12): on a phone the live demo used to
     be squeezed into the landing page's header, where its text was cut off and
     its start button covered the chat. The landing page's download card now
     has a "Demo" button that opens the same demo here, with the whole screen
     to itself. It is the same built app the landing page embeds (site/), with
     the same sample conversation -- nothing here is a separate copy to keep
     in step. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Not a page to land on from a search: it is a room off the landing page. -->
<meta name="robots" content="noindex">
<title>YouCoded demo</title>
<link rel="icon" href="favicon-light.svg">
<style>
  :root{--bar:52px;--bg:#1d1528;--fg:#f3ecfb;--dim:rgba(243,236,251,.62);--accent:#a366d6}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font:500 15px/1.2 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  .bar{position:fixed;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 8px 0;display:flex;align-items:center;gap:8px;z-index:2}
  .bar a{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;
    color:var(--fg);text-decoration:none;font-weight:700;white-space:nowrap}
  .bar a:active{opacity:.7}
  .bar .get{background:var(--accent);color:#fff}
  .bar .what{flex:1;min-width:0;text-align:center;color:var(--dim);font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bar) + env(safe-area-inset-top,0px))}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .3s}
  .stage.live iframe{opacity:1}
  .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
  .stage.live .wait{display:none}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="./" aria-label="Back to the YouCoded website">&larr; Back</a>
  <span class="what">Demo &middot; Sample data</span>
  <a class="get" href="./#download">Download</a>
</div>
<div class="stage" id="stage">
  <div class="wait" id="wait">Loading the demo&hellip;</div>
  <iframe id="app" title="YouCoded live demo"></iframe>
</div>
<script>
(function(){
  var stage = document.getElementById('stage'), f = document.getElementById('app');
  // The landing page passes the look the visitor picked as #t=<theme>; only
  // plain theme names are accepted, anything else falls back to the default.
  var m = /^#t=([a-z0-9-]{1,40})$/.exec(location.hash || ''), theme = m ? m[1] : 'youcoded';
  // "Back" returns to where the visitor was on the landing page (same scroll
  // position) when they came from it; opened directly, it goes to the site.
  var back = document.querySelector('.back');
  back.addEventListener('click', function(e){
    var ref = ''; try { ref = new URL(document.referrer).origin; } catch (_) {}
    if (ref === location.origin && history.length > 1) { e.preventDefault(); history.back(); }
  });
  f.addEventListener('load', function(){
    // The demo is the desktop app, so its title bar carries minimise / maximise
    // / close buttons. On a web page they control nothing; hide them (the same
    // thing the landing page's embed does on phones).
    try {
      var d = f.contentDocument, st = d.createElement('style');
      st.textContent = '.caption-buttons{display:none !important}';
      (d.head || d.documentElement).appendChild(st);
    } catch (_) { /* leave the app as it is */ }
    // Wait until the app has actually drawn its message box, not just loaded
    // its script, so the visitor never sees a half-built window. Capped at 4s.
    var t0 = Date.now();
    (function poll(){
      var ready = false;
      try { ready = !!f.contentDocument.querySelector('.input-bar-container'); } catch (_) { ready = true; }
      if (!ready && Date.now() - t0 <= 4000) { setTimeout(poll, 60); return; }
      // Put the app in the visitor's chosen look BEFORE it is shown, the same
      // way the landing page does it (the app's own appearance switch, no reload).
      try { if (f.contentWindow.__workbenchAppearanceSync) f.contentWindow.__workbenchAppearanceSync({ theme: theme }); } catch (_) {}
      setTimeout(function(){ stage.classList.add('live'); }, 120);
    })();
  });
  f.addEventListener('error', function(){
    document.getElementById('wait').textContent = 'The demo could not load. Check your connection and try again.';
  });
  f.src = 'site/index.html?mode=workbench&child=1&scenario=site&latency=0&reply=site#t=' + theme;
})();
</script>
</body>
</html>
