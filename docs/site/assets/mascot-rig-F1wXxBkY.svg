<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -5 30 30">
  <!--
    Example rig: Halftone Dimension — the theme's shipped capsule buddy rebuilt to the rig
    contract. 2.5D-soft shading stack on the theme's ink-navy body, with the identity kept
    hardcoded (README → Tinting):
      body #191327 · highlight #332852 · shade #0b0813 · face #33265c with a #00b8ff outline (a near-black face with no outline was invisible on this body)
      CMYK dots + sparkles #e8234a (red) / #00b8ff (cyan) / #ffea00 (yellow)
    The chromatic rim light (cyan top-left / red bottom-right) replaces the single warm rim —
    the misregistered-print read. The dimensional visor is NOT pre-filled — it hid every expression, so it ships as an
    opt-in component at mascots/components/eyewear/dimensional-visor.svg (from the repo root).
    The chromatic after-image ghost + glitch bars are NOT baked — they ship as scene
    companions that spring-follow the buddy (README → Scene companions).
    NOTE: the shipped flat art drew this body in currentColor, which renders BLACK through
    the app's <img> path — hardcoding the navy here is the fix, not a style change.
    Contract: mascots/README.md (from the repo root)
  -->
  <defs>
    <radialGradient id="hd-hi" cx="33%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#332852" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#332852" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hd-lo" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="52%" stop-color="#0b0813" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0813" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hd-limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191327"/>
      <stop offset="100%" stop-color="#0b0813"/>
    </linearGradient>
    <radialGradient id="hd-spec" cx="30%" cy="16%" r="26%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hd-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
  </defs>
  <g id="rig-root">
