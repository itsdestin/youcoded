      </g>
      <g id="rig-face-blink" style="display:none">
        <path d="M8 9.8 Q9.3 10.3 10.6 9.8" fill="none" stroke="#1A0F28" stroke-width="0.85" stroke-linecap="round"/><path d="M13.4 9.6 Q14.7 10.1 16 9.6" fill="none" stroke="#1A0F28" stroke-width="0.85" stroke-linecap="round"/><g transform="rotate(-2 12 13.35)"><path d="M10.8 13.35 Q10.8 13.05 12 13.05 Q13.2 13.05 13.2 13.35 A1.1 1 0 0 1 10.8 13.35 Z" fill="#1A0F28"/></g><g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round"><line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/><line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/></g>
      </g>
