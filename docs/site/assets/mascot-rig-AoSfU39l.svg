<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -5 30 30">
  <!--
    Example rig: Kuromi Dreamer — the theme's flat mascot set rebuilt to the rig contract.
    Outline (white-body) style: depth comes from the shade gradient, not highlights.
    Identity colors (hardcoded on purpose):
      line #1A0F28 (theme fg) · charm pink #FF4FB8 · shade #d9cbe9
    Signature components baked into slots: jester hat + skull charm (slot-hat), devil
    tail as an extra part (rig-tail — optional id, trails like a limb if the app
    chooses to animate it).
    Contract: mascots/README.md (from the repo root)
  -->
  <defs>
    <linearGradient id="g-lo" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="52%" stop-color="#d9cbe9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d9cbe9" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <g id="rig-root">
    <g id="rig-tail" data-pivot="19 14">
      <path d="M19 14 Q21 14 21.5 15.5 Q22 17 20.5 17.2 L21.5 18.2 L20 18 L21 19 L19.5 18.5 Z" fill="#1A0F28" opacity="0.85"/>
    </g>
    <g id="rig-arm-left" data-pivot="2.5 9">
      <rect x="1" y="9" width="3" height="4" rx="0.8" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
    </g>
    <g id="rig-arm-right" data-pivot="21.5 9">
      <rect x="20" y="9" width="3" height="4" rx="0.8" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
      <g id="slot-item"/>
    </g>
    <g id="rig-leg-left" data-pivot="8.95 17">
