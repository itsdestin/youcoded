        <ellipse cx="9.3" cy="9.5" rx="1.51" ry="2.13" fill="#1A0F28"/><g class="pupil"><circle cx="9.73" cy="8.69" r="0.58" fill="#FFFFFF"/><circle cx="8.76" cy="10.06" r="0.24" fill="#FFFFFF" fill-opacity="0.85"/></g><ellipse cx="14.7" cy="9.3" rx="1.51" ry="2.13" fill="#1A0F28"/><g class="pupil"><circle cx="15.13" cy="8.49" r="0.58" fill="#FFFFFF"/><circle cx="14.16" cy="9.86" r="0.24" fill="#FFFFFF" fill-opacity="0.85"/></g><path d="M7.95 6.4 Q9.3 5.8 10.65 6.4" fill="none" stroke="#1A0F28" stroke-width="0.5" stroke-linecap="round"/><path d="M13.35 6.1 Q14.7 5.5 16.05 6.1" fill="none" stroke="#1A0F28" stroke-width="0.5" stroke-linecap="round"/><ellipse cx="12" cy="13.65" rx="0.7" ry="0.85" fill="#1A0F28"/><g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round"><line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/><line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/></g>
