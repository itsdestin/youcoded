appId: com.youcoded.desktop
productName: YouCoded
directories:
  output: release
  buildResources: assets
win:
  target: nsis
  # WHY an explicit .ico: left to itself electron-builder shrinks icon.png for every size,
  # which blurs the mascot's eyes at 16 and 24px. icon.ico carries a separate drawing for each
  # small size. All icon files are generated by scripts/build-icons.mjs (repo root) from
  # scripts/icons/brand-icons.html; never hand-edit them.
  icon: icon.ico
# WHY: the downloaded installer used to be "YouCoded.Setup.1.2.4.exe" wearing the
# app's own icon, and Windows users searching "youcoded" could not tell it from the
# app. "Installer" in the name says what it is. Dashes, never spaces: GitHub turns a
# space into a dot, and the in-app updater's "already downloaded?" check needs a
# dash before the version (update-installer.ts buildVersionRegex). The website and
# the updater pick files by extension, so neither cares about the rest of the name.
# Pinned by tests/installer-artifact-names.test.ts.
nsis:
  artifactName: "${productName}-Installer-${version}.${ext}"
  # WHY a separate icon: the installer wore the app's own icon, so Start-menu search showed two
  # identical tiles. Destin's pick (brand round 22): the face rising out of an open box.
  # The header icon is the small one beside the one-click progress bar.
  installerIcon: installer-icon.ico
  installerHeaderIcon: installer-icon.ico
dmg:
  # The icon of the mounted disk in Finder, so it is not a second "YouCoded" app tile.
  icon: installer-icon.icns
  # Same reason on macOS. Setting any pattern also puts the arch on the Intel build
  # ("-x64"; electron-builder drops it only from its OWN default name). The website
  # and the updater tell Mac builds apart by "contains arm64 or not", so both resolve.
  artifactName: "${productName}-Installer-${version}-${arch}.${ext}"
  # The disk that appears in Finder's sidebar once the file is opened. It was
  # "YouCoded 1.2.4", sitting beside an app also called YouCoded.
  title: "Install ${productName}"
mac:
  # WHY icon.icon: macOS 26 draws Liquid Glass icons from Apple's layered Icon Composer format
  # (background, face, eyes) and re-colours them for the Dark, Clear and Tinted looks (brand
  # round 27). electron-builder compiles it with Xcode 26's actool into Assets.car plus a flat
  # .icns for older macOS — so the Mac build machine needs Xcode 26 or newer. Generated by
  # scripts/build-icons.mjs; icon-mac.icns is the same design flat, the drop-in fallback here if
  # actool is ever unavailable.
  icon: icon.icon
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  # WHY: without this the Mac build ships with NO signature of its own, and macOS
  # rejects it as a BROKEN app rather than an unverified one — which removes the
  # "Open Anyway" button from System Settings and leaves users with no way in at all.
  #
  # We have no Apple certificate, so "-" means "sign it as ourselves, unverified".
  # electron-builder used to do this automatically: up to 26.8.1 it fell back to an
  # ad-hoc signature when it found no certificate. 26.15.3 (Dependabot, 2026-07-23,
  # c2dac26b) deleted that fallback and now silently skips signing, which is how
  # v1.2.4 shipped correctly sealed and 1.3.0-beta.72 shipped unopenable.
  # This line restores exactly what v1.2.4 had.
  #
  # WHEN A REAL APPLE CERTIFICATE ARRIVES, DELETE THIS LINE - do not just add the
  # CSC_LINK secrets beside it. electron-builder treats '-' as a name to look for in
  # the keychain first, finds nothing, and falls back to ad-hoc - so with this line
  # present a real certificate would sit unused and every build would still be
  # self-signed, and the CI check below cannot tell the two apart by identifier.
  identity: '-'
  # WHY: electron-builder's own fail-loud switch. With it, "could not sign" is a build
  # ERROR instead of a warning, so a local `npm run build` on a Mac, a VM test build,
  # or a future version that drops the '-' opt-in the way 26.15.3 dropped the automatic
  # fallback all stop dead before a dmg is cut - not only where the CI check runs.
  # MUST stay nested under mac: - at the top level it also applies to Windows, which
  # we ship unsigned. Safe on Linux/Windows runners: signing is skipped before this is
  # consulted. Complements the CI check, which additionally proves the seal is valid.
  forceCodeSigning: true
  # WHY (Task 9): the signer signs every non-text file in the app one by one, and the Office
  # add-on has ~600 (editor images, fonts, templates). Only its converter is code: x2t and its
  # dylibs, which DO get signed (ad hoc, like the app) — macOS refuses to run unsigned code on
  # Apple silicon, and upstream's own signature does not survive into our bundle's seal. Every
  # other add-on file is still covered by the app's seal as a plain resource, so
  # verify-mac-signature.sh's --deep --strict check sees any change to any of them.
  signIgnore:
    - "/Contents/Resources/office/(?!converter/(x2t|[^/]+\\.dylib)$)"
  # WHY: macOS does not ask the user for microphone permission unless the app has
  # already declared, in its Info.plist, WHY it wants the microphone. With this
  # string missing, the first touch of the mic does not produce a denied prompt -
  # the system KILLS the app outright, which would look to a user like YouCoded
  # crashing the moment they press the voice button. extendInfo is how
  # electron-builder writes extra keys into the packaged Info.plist.
  extendInfo:
    NSMicrophoneUsageDescription: YouCoded turns your speech into text on this computer.
linux:
  # AppImage runs on any distro but stays a loose file. deb / rpm / pacman are
  # real installers (Debian-Ubuntu / Fedora / Arch) that install to a fixed
  # path and register a menu entry + icon, so YouCoded pins to the taskbar and
  # behaves like a native app.
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  category: Development
  # maintainer is required by the deb/rpm packagers.
  maintainer: itsdestin <itsdestin@users.noreply.github.com>
  synopsis: Desktop GUI for Claude Code with the YouCoded toolkit
  # WHY: the AppImage catalog (and other Linux app stores) read this file from
  # usr/share/metainfo/ inside the AppImage for our description and OUR chosen
  # screenshots; without it they show a robot's picture of the sign-in screen.
  # electron-builder copies the app folder into the AppImage's root, so this path
  # lands exactly there. extraFiles is per platform, not per target, so the deb /
  # rpm / pacman packages also carry a copy under /opt/YouCoded/usr/share/metainfo/,
  # where nothing reads it: harmless, just unused.
  extraFiles:
    - from: linux/ai.youcoded.YouCoded.metainfo.xml
      to: usr/share/metainfo/ai.youcoded.YouCoded.metainfo.xml
pacman:
  # electron-builder auto-generates Debian-style dependency names for the
  # pacman target, and `libappindicator-gtk3` is AUR-only — not in Arch's
  # official repos — so a stock `pacman -U` of the package fails to resolve
  # it. Pin the real Arch runtime deps instead (all in core/extra).
  depends:
    - gtk3
    - nss
    - libxss
    - libnotify
    - alsa-lib
npmRebuild: false
asarUnpack:
  - dist/main/pty-worker.js
  # Read's PDF text extraction (main process, src/main/harness/pdf-text.ts)
  # loads pdf.js's legacy ESM build, whose fake-worker path does a dynamic
  # `import('./pdf.worker.mjs')` relative to pdf.mjs and reads its bundled
  # fonts/CMaps by plain path. Unpacked so those resolve to real files rather
  # than entries inside app.asar.
  - node_modules/pdfjs-dist/legacy/**
  - node_modules/pdfjs-dist/standard_fonts/**
  - node_modules/pdfjs-dist/cmaps/**
  - scripts/**/*
  # WHY: askpass.cjs (scripts/askpass/, unpacked by the entry above) calls
  # koffi (prctl/ptrace, admin-password design §2.1, review 2 E1) via a
  # plain ancestor-walk require reaching two directories up from itself.
  # Without this, koffi stays packed inside app.asar, which is a SIBLING of
  # app.asar.unpacked, not an ancestor Node's module resolution ever
  # reaches from unpacked code — proven empirically with this repo's own
  # @electron/asar + electron binary (design review 3, F1): the exact same
  # require that works when the requiring file is itself inside app.asar
  # (window-exclude-capture.ts's existing koffi use) fails with "Cannot
  # find module 'koffi'" for a file living in app.asar.unpacked. This entry
  # makes app.asar.unpacked/node_modules/koffi a real sibling directory of
  # app.asar.unpacked/scripts/askpass/, which the plain require then finds.
  - node_modules/koffi/**
  - hook-scripts/**/*
  # The KWin script the Linux buddy installs into the user's own
  # ~/.local/share/kwin/scripts/. `assets/**` is packaged INSIDE app.asar, and
  # the recursive copy helpers (fs.cpSync and friends) are not asar-aware — they
  # see the archive as a single file. kwin-helper.ts therefore copies the
  # package one file at a time with readFileSync/writeFileSync, which IS
  # asar-aware, so this entry is belt-and-braces rather than the only defence:
  # it also puts the package on disk as real files, so anything added later that
  # walks the directory keeps working.
  - assets/kwin-helper/**
files:
  - dist/**/*
  # WHY: src/main/harness/eval/ is the harness evaluator — developer tooling
  # driven only by test-engine/harness-eval.mjs and friends. It lives under
  # src/main so each eval arm's `npm run build:main` compiles it beside the
  # code it evaluates, which means tsc emits it into dist/ and, without this
  # line, every installer carried ~4,200 lines (14 files, its OpenRouter
  # factory and fixtures) that no IPC channel, npm script or screen reaches.
  # Nothing packaged imports from it; tests/harness-eval-not-shipped.test.ts
  # keeps both halves of that true. Quoted because "!" starts a YAML tag.
  - "!dist/main/harness/eval/**"
  - node_modules/**/*
  - scripts/**/*
  - hook-scripts/**/*
  - assets/**/*
  - package.json
  # WHY: office-root.ts imports the pin (compiled to require('../../../office-pin.json'), which
  # resolves to app.asar's root). Without it a packaged app could not start at all — the main
  # process died on that require (first seen in the Linux CI smoke test, Task 9).
  - office-pin.json
# WHY a resource, not inside app.asar: x2t is a native program that must run from a real
# folder, and the AGPL add-on stays a separate program beside the MIT app (contract R2).
# WHY ${platform}-${arch} (Task 9): each installer needs its own platform's converter, and the
# Mac runner cuts the Intel and Apple-silicon dmgs in one run. `npm run build` fills
# office-build/<platform>-<arch>/ for every arch pinned for this OS (fetch-office.mjs --release).
# ${platform} is the BUILD machine's OS — every installer is built on its own OS (both release
# workflows). A platform with no pinned bundle (ARM Linux) has no folder; electron-builder then
# warns "file source doesn't exist" and packs no Office, and the app opens Office files with the
# computer's default app. Pinned by tests/office/fetch-office.test.ts.
extraResources:
  - from: office-build/${platform}-${arch}
    to: office
    filter: ["**/*"]
