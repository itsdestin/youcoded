<!doctype html>
<html><head><meta charset="utf-8"><title>Money</title>
<!--
  Money page — design-stage mockup (finance dashboard, 2026-10-05).
  Decisions: docs/active/design/2026-10-05-finance-dashboard/ — the questions deck
  (summary first, grouped by kind, card bars warn at 30% / alert at 80%, bills by due
  date with late and "reaches your credit report" warnings, net-worth history, live
  check on open, stale after 3 days, typed-in accounts editable here and by chat,
  balances only) and review round 1 (accounting brackets for negatives, the Home
  page's raised-glass look, links out to each provider's own site).
  Everything shown comes from youcoded.data, so the same file runs against the
  workbench's made-up numbers now and Plaid-fed numbers later.
-->
<style>
  :root { --warn: var(--warning-fg, #c77a00); --bad: var(--destructive-fg, #d33); }
  body { font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 14px; }

  /* Raised glass, same recipe as the Home page's look layer: a faint top-lit gradient, a hairline
     highlight along the top edge, a soft shadow under it. Colours only from the theme. */
  .card { position: relative; border-radius: 24px; padding: 18px; border: 1px solid color-mix(in srgb, var(--fg) 11%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--fg) 6%, var(--panel)), var(--panel));
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fg) 12%, transparent), 0 14px 30px -18px rgba(0,0,0,.55); }
  .tile { position: relative; border-radius: 18px; border: 1px solid color-mix(in srgb, var(--fg) 9%, transparent);
    background: color-mix(in srgb, var(--fg) 4%, var(--panel)); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fg) 8%, transparent); }
  :root[data-yc-see-through] .card { background: linear-gradient(180deg, color-mix(in srgb, var(--fg) 6%, transparent), transparent 55%),
      color-mix(in srgb, var(--panel) calc(var(--panels-opacity, 1) * 60%), transparent); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-head h2 { flex: 1; font-size: 16px; font-weight: 600; letter-spacing: -.005em; }
  .card-head .total { font-size: 15px; font-weight: 500; }
  .label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); }
  .muted { color: var(--fg-muted); }
  .small { font-size: 12px; }
  svg.i { width: 16px; height: 16px; flex: none; }

  /* Top row: the page's name and quiet status pills, like the Home page's tab row. */
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { appearance: none; font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 6px;
    border-radius: 9999px; border: 1px solid var(--edge-dim); background: var(--panel); color: var(--fg); white-space: nowrap; cursor: pointer;
    transition: border-color 120ms ease, transform 90ms ease; }
  .pill:hover { border-color: var(--edge); }
  .pill:active { transform: scale(.97); }
  .pill.title { background: var(--fg); border-color: var(--fg); color: var(--panel); cursor: default; font-weight: 500; }
  .pill.title:active { transform: none; }
  .pill-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--well); color: var(--fg-2); }
  .pill.title .pill-ic { background: var(--panel); color: var(--fg); }
  .pill-ic.bad { background: var(--bad); color: #fff; box-shadow: 0 0 14px color-mix(in srgb, var(--bad) 60%, transparent); }
  .pill-ic.warn { background: var(--warn); color: #1a1200; }
  .pill-ic.ok { background: color-mix(in srgb, var(--fg) 12%, var(--panel)); }
  .pill-ic svg { width: 14px; height: 14px; }
  .top .spacer { flex: 1; }
  .btn { appearance: none; font: inherit; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border-radius: 9999px; border: 1px solid var(--edge); background: var(--inset); color: var(--fg); cursor: pointer; white-space: nowrap; text-decoration: none;
    transition: background-color 120ms ease, border-color 120ms ease, transform 90ms ease; }
  .btn:hover { background: var(--well); border-color: var(--fg-faint); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible, .pill:focus-visible, .ibtn:focus-visible, .rng:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--fg); border-color: var(--fg); color: var(--panel); }
  .btn.sm { height: 28px; font-size: 11px; padding: 0 10px; }
  .btn svg { width: 14px; height: 14px; }
  .ibtn { appearance: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--edge-dim); background: var(--panel); color: var(--fg-2);
    display: inline-grid; place-items: center; cursor: pointer; flex: none; text-decoration: none; transition: border-color 120ms ease, color 120ms ease, transform 90ms ease; }
  .ibtn:hover { border-color: var(--edge); color: var(--fg); }
  .ibtn:active { transform: scale(.94); }
  .ibtn svg { width: 14px; height: 14px; }

  /* Hero: the big number and its chart in one card, the three other totals beside it. */
  .hero { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(220px, 1fr); gap: 14px; }
  .nw .big { font-size: 40px; font-weight: 500; line-height: 1.05; letter-spacing: -.01em; margin-top: 6px; }
  .nw .delta { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; padding: 3px 10px; border-radius: 9999px;
    background: color-mix(in srgb, var(--fg) 7%, transparent); color: var(--fg-2); }
  .nw .delta svg { width: 12px; height: 12px; }
  .nw-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .ranges { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9999px; background: var(--well); border: 1px solid var(--edge-dim); }
  .rng { appearance: none; font: inherit; font-size: 11px; font-weight: 500; height: 26px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 9999px;
    background: transparent; color: var(--fg-2); cursor: pointer; }
  .rng.on { background: var(--fg); color: var(--panel); }
  .chart { position: relative; height: 190px; margin-top: 14px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .grid line { stroke: color-mix(in srgb, var(--fg) 8%, transparent); }
  .chart .axis text { fill: var(--fg-muted); font-size: 11px; }
  .chart .line { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .zero { stroke: var(--fg-faint); stroke-dasharray: 3 4; }
  .chart .cross { stroke: var(--fg-muted); }
  .chart .dot { fill: var(--fg); stroke: var(--panel); stroke-width: 3; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 6px 10px; font-size: 12px;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,.5); white-space: nowrap; transform: translate(-50%, -120%); }
  .stats { display: flex; flex-direction: column; gap: 10px; }
  .stat { padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex: 1; }
  .stat .v { font-size: 22px; font-weight: 500; line-height: 1.15; margin-top: 2px; }
  .stat .sub { font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
  .badge { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--well); color: var(--fg-2); }
  .badge svg { width: 18px; height: 18px; }

  /* Needs you: one tile per account, glowing in its warning colour. */
  .needs { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
  .need { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; overflow: hidden;
    border-color: color-mix(in srgb, var(--c) 45%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--c) 25%, transparent), 0 10px 26px -16px var(--c); }
  .need::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .22;
    background: radial-gradient(120% 160% at 0% 0%, var(--c), transparent 70%); }
  .need.bad { --c: var(--bad); } .need.warn { --c: var(--warn); }
  .need > * { position: relative; }
  .need .txt { flex: 1; min-width: 0; }
  .need .who { font-weight: 500; }
  .need .facts { font-size: 12px; color: var(--fg-2); margin-top: 2px; }
  .need .facts b { font-weight: 500; color: var(--fg); }

  /* Accounts */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .sec + .sec { margin-top: 12px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .acct { padding: 8px 10px 8px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
  .acct .who { min-width: 0; }
  .acct .who .inst { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .acct .right .side { min-height: 26px; }
  .acct .right .side .ibtn { width: 26px; height: 26px; }
  .acct .right .side .btn.sm { height: 24px; }
  .acct .inst { display: block; font-size: 11px; font-weight: 500; color: var(--fg-muted); letter-spacing: .02em; line-height: 1.3; }
  .acct.stale .name, .acct.stale .bal { color: var(--fg-dim); }
  .mark { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: -.02em;
    color: #fff; background: var(--b, var(--well)); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); flex: none; }
  .acct > .mark { grid-row: auto; }
  .acct .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .bal { font-weight: 500; text-align: right; }
  /* Second line spans both columns so the status and buttons never squeeze the name on the first line. */
  .acct .row2 { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .acct .meta { flex: 1; min-width: 0; font-size: 12px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .side { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; color: var(--fg-muted); flex: none; }
  .src { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .src svg { width: 12px; height: 12px; }
  .flag { display: inline-flex; align-items: center; gap: 4px; color: var(--warn); white-space: nowrap; }
  .flag svg { width: 12px; height: 12px; }
  .acct .meter { margin-top: 0; }
  .meter { grid-column: 2 / -1; display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .bar { flex: 1; height: 10px; border-radius: 9999px; background: color-mix(in srgb, var(--fg) 9%, var(--well)); position: relative; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 9999px; background: var(--fg-2); }
  .bar .tick { position: absolute; top: 2px; bottom: 2px; width: 2px; border-radius: 2px; background: var(--panel); opacity: .9; }
  .meter.warn .bar > i { background: var(--warn); box-shadow: 0 0 12px color-mix(in srgb, var(--warn) 60%, transparent); }
  .meter.bad .bar > i { background: var(--bad); box-shadow: 0 0 12px color-mix(in srgb, var(--bad) 60%, transparent); }
  .meter .pct { font-size: 12px; color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; min-width: 150px; justify-content: flex-end; }
  .meter.warn .pct svg { color: var(--warn); } .meter.bad .pct svg { color: var(--bad); }
  .meter .pct svg { width: 12px; height: 12px; }
  .legend { font-size: 11px; color: var(--fg-muted); padding: 0 4px 8px; }
  .edit { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .edit input { font: inherit; font-size: 14px; width: 150px; height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid var(--edge); background: var(--inset); color: var(--fg); }
  .edit input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .edit .hint { flex: 1; min-width: 160px; font-size: 11px; color: var(--fg-muted); }

  /* Bills */
  .bills { display: flex; flex-direction: column; gap: 8px; }
  .bill { display: flex; gap: 12px; align-items: center; padding: 8px 10px 8px 12px; }
  .bill .name { flex: 1; min-width: 0; }
  .bill .mark { width: 30px; height: 30px; border-radius: 10px; font-size: 10px; }
  .bill .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bill .name small { font-size: 11px; color: var(--fg-muted); margin-left: 6px; }
  .when { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 9999px; white-space: nowrap;
    background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg-2); }
  .when svg { width: 12px; height: 12px; }
  .bill.soon .when { background: color-mix(in srgb, var(--fg) 12%, transparent); color: var(--fg); }
  .bill.late .when { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--fg); }
  .bill.late .when svg { color: var(--warn); }
  .bill.report { border-color: color-mix(in srgb, var(--bad) 45%, transparent); box-shadow: 0 10px 26px -18px var(--bad); }
  .bill.report .when { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--fg); font-weight: 500; }
  .bill.report .when svg { color: var(--bad); }
  .bill.paid { opacity: .6; }
  .bill .amt { font-weight: 500; text-align: right; min-width: 76px; }

  .menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 6px;
    min-width: 240px; z-index: 5; box-shadow: 0 16px 40px -12px rgba(0,0,0,.5); }
  .menu button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; background: none; border: 0; color: var(--fg);
    font: inherit; font-size: 13px; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
  .menu button:hover { background: var(--inset); }
  .menu span { font-size: 11px; color: var(--fg-muted); }
  .menu-pick { border-top: 1px solid var(--edge-dim); margin-top: 4px; padding: 8px 10px 4px; display: flex; flex-direction: column; gap: 6px; }
  .menu .menu-pick .rng { display: inline-flex; width: auto; padding: 0 10px; font-size: 11px; border-radius: 9999px; color: var(--fg-2); }
  .menu .menu-pick .rng.on { background: var(--fg); color: var(--panel); }
  .empty { padding: 28px 12px; text-align: center; color: var(--fg-muted); font-size: 13px; }

  @media (max-width: 860px) { .hero, .cols { grid-template-columns: 1fr; } .stats { flex-direction: row; flex-wrap: wrap; } .stat { min-width: 200px; } }
  @media (max-width: 560px) {
    .bill { flex-wrap: wrap; } .bill .when { order: 9; margin-left: 42px; } .bill .ibtn { display: none; }
    .nw .big { font-size: 32px; } .meter .pct { min-width: 0; }
  }
  /* Real logos: a bank's own picture from Plaid fills the badge; a brand mark sits inside it. */
  .mark svg { width: 20px; height: 20px; }
  .bill .mark svg { width: 16px; height: 16px; }
  .mark.logo { background: #fff; overflow: hidden; padding: 4px; }
  .mark.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .btn.danger { border-color: var(--bad); color: var(--fg); }
  .btn.danger:hover { background: color-mix(in srgb, var(--bad) 18%, var(--inset)); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .menu button:disabled { opacity: .5; cursor: default; background: none; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; } .row-btns.end { justify-content: flex-end; margin-top: 14px; }
  .empty-card { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 28px; }
  .empty-card h2 { font-size: 18px; font-weight: 600; } .empty-card p { max-width: 560px; }
  .badge.big { width: 48px; height: 48px; border-radius: 16px; } .badge.big svg { width: 22px; height: 22px; }
  .form-card .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg-2); }
  .fld input, .fld select { font: inherit; font-size: 14px; height: 34px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--edge); background: var(--inset); color: var(--fg); }
  .fld input:focus, .fld select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fld.chk { flex-direction: row; align-items: center; gap: 8px; align-self: end; height: 34px; }
  .fld.chk input { height: auto; accent-color: var(--accent); }
  .bank-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 12px; }
  .bank-row .name { flex: 1; font-weight: 500; }
  .need.note { padding: 10px 12px; }
  /* Everything you can open answers the pointer like the Home page's tiles: the edge brightens and the card lifts a
     touch on hover, it squeezes slightly while pressed, and an open card stays lit. Transform only, so nothing reflows. */
  .tap { cursor: pointer; transition: transform 140ms ease, border-color 140ms ease, box-shadow 180ms ease, background-color 140ms ease; }
  @media (hover: hover) {
    .tap:hover { border-color: color-mix(in srgb, var(--fg) 22%, transparent); transform: translateY(-1px);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fg) 12%, transparent), 0 12px 26px -14px rgba(0,0,0,.6); }
    .need.tap:hover { border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--c) 30%, transparent), 0 14px 32px -12px var(--c); }
    .tap:hover .chev { color: var(--fg); }
  }
  .tap:active { transform: scale(.985); }
  .tap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tap.open { border-color: color-mix(in srgb, var(--fg) 26%, transparent); background: color-mix(in srgb, var(--fg) 7%, var(--panel)); }
  .tap.open:active { transform: none; }
  .chev { width: 16px; height: 16px; color: var(--fg-faint); transition: transform 180ms ease, color 140ms ease; flex: none; }
  .open > .chev, .open .head-chev .chev { transform: rotate(180deg); }
  .acct .chev { grid-column: 3; justify-self: end; }
  .detail { cursor: default; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; padding-top: 12px; margin-top: 6px; border-top: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
  .acct .detail { grid-column: 1 / -1; }
  .bill .detail { flex-basis: 100%; }
  .dt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .dt span { font-size: 11px; color: var(--fg-muted); letter-spacing: .04em; text-transform: uppercase; }
  .dt b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .ins-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .ins { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--fg) 5%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 7%, transparent); }
  .ins b { font-size: 16px; font-weight: 600; }
  .ins span { font-size: 12px; color: var(--fg-2); line-height: 1.35; }
  .ins.up b { color: color-mix(in srgb, #3fb950 75%, var(--fg)); }
  .ins.down b, .ins.warnish b { color: var(--warn); }
  .spark { grid-column: 1 / -1; }
  .spark svg { width: 100%; height: 44px; display: block; }
  .spark .ln { fill: none; stroke: var(--fg-2); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .spark .area { fill: color-mix(in srgb, var(--fg) 7%, transparent); }
  .spark-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
  .spark.empty { font-size: 12px; color: var(--fg-muted); padding: 4px 0; }
  .detail .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .detail .acts .hint { flex: 1; min-width: 160px; font-size: 11px; color: var(--fg-muted); }
  .detail input { font: inherit; font-size: 14px; width: 140px; height: 30px; padding: 0 12px; border-radius: 9999px; border: 1px solid var(--edge); background: var(--inset); color: var(--fg); }
  .bill { flex-wrap: wrap; }
  .stat.tap .chev { margin-left: auto; }
  @media (prefers-reduced-motion: reduce) { .pill, .btn, .ibtn, .tap, .chev { transition: none; } .tap:hover, .tap:active { transform: none; } }
</style></head>
<body>
<div class="wrap" id="root"></div>
<script>
(function(){
  function ic(d){ return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
  var I = {
    money: ic('<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
    warn: ic('<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>'),
    stop: ic('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>'),
    link: ic('<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>'),
    pen: ic('<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>'),

  function stat(icon, label, v, sub, jump){ return '<div class="tile stat tap" role="button" tabindex="0" data-jump="' + jump + '" title="Show these accounts"><span class="badge">' + icon + '</span><div><div class="label">' + label + '</div><div class="v num">' + v + '</div><div class="sub">' + sub + '</div></div>' + I.chev.replace('class="chev"', 'class="chev" style="transform:rotate(-90deg)"') + '</div>'; }

  function sec(k, label){

    var h = '<div class="sec"><div class="sec-head"><span class="label">' + label + ' <span style="opacity:.6">' + list.length + '</span></span><span class="small num muted">' + money(signed) + '</span></div>';

  // ── Opened cards: what the page can work out, not what the card already says ──
  // Months to pay a balance off at a fixed payment, and the interest on the way; null when the payment never
  // gets ahead of the interest (or there is no rate to work with).
  function payoff(balance, apr, pay){
    if (!(balance > 0) || !(pay > 0)) return null;
    var r = (apr || 0) / 100 / 12, b = balance, months = 0, interest = 0;
    if (r > 0 && pay <= b * r) return { never: true };
    while (b > 0.005 && months < 600) { var i = b * r; interest += i; b = b + i - pay; months++; }
    return months >= 600 ? { never: true } : { months: months, interest: interest };
  }
  function monthsFrom(n){ var d = today(); d.setMonth(d.getMonth() + n); return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
  function monthsText(n){ var y = Math.floor(n / 12), m = n % 12; return (y ? y + (y === 1 ? ' year' : ' years') : '') + (y && m ? ' ' : '') + (m || !y ? m + (m === 1 ? ' month' : ' months') : ''); }
  // One fact worth opening the card for: a big figure and a sentence saying what it means.
  function insight(figure, words, tone){ return '<div class="ins' + (tone ? ' ' + tone : '') + '"><b class="num">' + figure + '</b><span>' + words + '</span></div>'; }
  // The account's own balance, day by day, as a small line.
  function spark(hist){
    if (!hist || hist.length < 2) return '<div class="spark empty">Its own chart starts here and adds a point each day the page checks.</div>';
    var pts = hist.slice(-90), vs = pts.map(function(p){ return p.v; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs); if (hi === lo) { hi += 1; lo -= 1; }
    var W = 300, H = 44, x = function(i){ return (W * i / (pts.length - 1)).toFixed(1); }, y = function(v){ return (4 + (H - 8) * (1 - (v - lo) / (hi - lo))).toFixed(1); };
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i) + ' ' + y(p.v); }).join('');
    return '<div class="spark"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Balance over the last ' + pts.length + ' days"><path d="' + d + 'L' + W + ' ' + H + 'L0 ' + H + 'Z" class="area"/><path d="' + d + '" class="ln"/></svg><div class="spark-x"><span>' + short(day(pts[0].d)) + '</span><span>' + short(day(pts[pts.length - 1].d)) + '</span></div></div>';
  }
  function change30(hist, debt){
    if (!hist || hist.length < 2) return '';
    var now = hist[hist.length - 1], then = hist[0];
    for (var i = hist.length - 1; i >= 0; i--) { if (daysBetween(day(hist[i].d), today()) >= 30) { then = hist[i]; break; } }
    var diff = now.v - then.v, days = daysBetween(day(then.d), day(now.d));
    if (!days) return '';
    // For money owed, going down is the good direction.
    var good = debt ? diff < 0 : diff > 0;
    return insight((diff >= 0 ? '+' : '−') + money(Math.abs(diff), true), (debt ? (diff <= 0 ? 'less owed' : 'more owed') : (diff >= 0 ? 'more' : 'less')) + ' than ' + days + ' days ago', diff === 0 ? '' : good ? 'up' : 'down');
  }
  function accountDetail(a){
    var t = totals(), h = '<div class="detail">', ins = '';
    var debt = isDebt(a);
    if (a.kind === 'credit') {
      if (a.apr && a.balance > 0) ins += insight('≈' + money(a.balance * a.apr / 1200), 'interest a month if this balance is carried (' + a.apr + '% a year)', 'warnish');
      if (a.limit) {
        var under = a.balance - a.limit * S.warnPct / 100;
        ins += under > 0
          ? insight(money(Math.ceil(under), true), 'to pay now to get under ' + S.warnPct + '% of the limit, where it stops weighing on your credit score')
          : insight(money(Math.floor(-under), true), 'you can spend before this card passes ' + S.warnPct + '% of its limit');
      }
      if (a.payment && a.payment.amount > 0 && a.balance > 0) {
        var pm = payoff(a.balance, a.apr, a.payment.amount);
        if (pm && pm.never) ins += insight('Never', 'paid off at the ' + money(a.payment.amount) + ' minimum: it barely covers the interest', 'down');
        else if (pm) ins += insight(monthsText(pm.months), 'to clear it paying only the ' + money(a.payment.amount) + ' minimum' + (pm.interest > 1 ? ', costing about ' + money(pm.interest, true) + ' in interest' : ''));
      }
    } else if (a.kind === 'loan') {
      var pay = a.payment && a.payment.amount;
      if (pay && a.balance > 0) {
        var p0 = payoff(a.balance, a.apr, pay), p1 = payoff(a.balance, a.apr, pay + 50);
        if (p0 && p0.never) ins += insight('Never', 'paid off at ' + money(pay) + ' a month: that is less than the interest', 'down');
        else if (p0) {
          ins += insight(monthsFrom(p0.months), 'paid off at ' + money(pay) + ' a month (' + monthsText(p0.months) + ')' + (p0.interest > 1 ? ', with about ' + money(p0.interest, true) + ' of interest still to come' : ''));
          if (p1 && !p1.never && p0.months - p1.months > 0) ins += insight(monthsText(p0.months - p1.months) + ' sooner', 'with $50 more a month' + (p0.interest - p1.interest > 1 ? ', saving about ' + money(p0.interest - p1.interest, true) + ' in interest' : ''), 'up');
        }
      } else if (a.apr && a.balance > 0) ins += insight('≈' + money(a.balance * a.apr / 1200), 'of interest a month at ' + a.apr + '%. Add the monthly payment to see when it is paid off.');
      else if (a.balance > 0) ins += insight('No due date yet', a.source === 'plaid' ? 'your bank does not share payment details for this kind of loan. Add the payment and due date below, once.' : 'add the monthly payment and due date below to track it and see when it is paid off.');
    } else if ((a.kind === 'checking' || a.kind === 'savings') && t.dueThisMonth > 0) {
      ins += insight((a.balance / t.dueThisMonth).toFixed(1) + '×', 'what is still due this month (' + money(t.dueThisMonth, true) + ')');
    }
    var share = debt ? (t.owe ? a.balance / t.owe : 0) : (t.have ? a.balance / t.have : 0);
    if (share > 0 && share < 1) ins += insight(Math.round(share * 100) + '%', 'of everything you ' + (debt ? 'owe' : 'have'));
    ins += change30(a.hist, debt);
    h += '<div class="ins-grid">' + ins + '</div>' + spark(a.hist);
    h += '<div class="acts"><span class="hint">' + (a.source === 'plaid' ? 'From ' + esc(a.institution) + ' through Plaid' : 'Entered by you') + ' · updated ' + (a.updatedAt ? ago(a.updatedAt) : 'never') + (a.available != null && !debt ? ' · ' + money(a.available) + ' available' : '') + '</span>';
    if (payEdit === a.id) {
      var pp = a.payment || {};
      h += '<input id="pay-amt" class="num" inputmode="decimal" placeholder="Monthly payment" value="' + (pp.amount || '') + '" aria-label="Monthly payment">';
      h += '<input id="pay-due" type="date" value="' + esc(pp.due || '') + '" aria-label="Next due date">';
      h += '<input id="pay-apr" class="num" inputmode="decimal" placeholder="Interest %" value="' + (a.apr || '') + '" aria-label="Interest rate">';
      h += '<button class="btn sm" data-pay-cancel>Cancel</button><button class="btn sm primary" data-pay-save="' + esc(a.id) + '">Save</button>';
    } else if (limitEdit === a.id) {
      h += '<input id="limit-val" class="num" inputmode="decimal" value="' + (a.limit || '') + '" aria-label="Credit limit"><button class="btn sm" data-limit-cancel>Cancel</button><button class="btn sm primary" data-limit-save="' + esc(a.id) + '">Save limit</button>';
    } else {
      if (a.source !== 'plaid' && editing !== a.id) h += '<button class="btn sm" data-edit="' + esc(a.id) + '">' + I.pen + 'Update balance</button>';
      if (a.kind === 'credit') h += '<button class="btn sm" data-limit="' + esc(a.id) + '">' + (a.limit ? 'Change limit' : 'Set limit') + '</button>';
      // Where the bank shares no payment (auto loans, any typed-in loan), or it was entered by hand: add or change it.
      if ((a.kind === 'loan' || a.kind === 'credit') && (!a.payment || a.payment.manual || a.source !== 'plaid')) h += '<button class="btn sm" data-pay="' + esc(a.id) + '">' + (a.payment ? 'Change payment' : 'Add payment & due date') + '</button>';
      var u = siteOf(a); if (u) h += '<a class="btn sm" href="' + esc(u) + '" target="_blank" rel="noopener">' + I.out + 'Open ' + esc(a.institution) + '</a>';
      if (a.source === 'plaid') h += '<button class="btn sm" data-jump="banks">Manage bank</button>';
    }
    return h + '</div></div>';
  }
  function billDetail(b){
    var h = '<div class="detail">', ins = '';
    var monthly = b.bill ? b.bill.monthly !== false : true;
    if (monthly) ins += insight(money(b.amount * 12, true), 'a year at ' + money(b.amount) + ' a month');
    if (monthly && !b.paid) {

    if (log.length) ins += insight(log.length + (log.length === 1 ? ' time' : ' times'), 'marked paid here, most recently ' + short(day(log[log.length - 1])));

  // The add-by-hand forms: an account, or a bill (insurance, phone).

      h += '<label class="fld"><span>Kind</span><select id="f-kind"><option value="checking">Checking</option><option value="savings">Savings</option><option value="investment">Investments</option><option value="credit">Credit card</option><option value="loan" selected>Loan</option></select></label>';
      h += field('balance', 'Balance (what you have, or what you owe)', '', 'inputmode="decimal" placeholder="22,410.00"');
      h += field('limit', 'Credit limit (cards only)', '', 'inputmode="decimal"');
      h += field('apr', 'Interest rate %', '', 'inputmode="decimal"');
      h += field('payment', 'Monthly payment', '', 'inputmode="decimal"');
      h += field('due', 'Next payment due', '', 'type="date"');
    }
    h += '</div><datalist id="f-companies">' + Object.keys(PROVIDERS).map(function(n){ return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
    if (f.problem) h += '<div class="small" role="alert" style="color:var(--warn)">' + esc(f.problem) + '</div>';
    h += '<div class="row-btns end"><button class="btn" data-form-cancel>Cancel</button><button class="btn primary" data-form-save>Add</button></div></div>';
    return h;
  }
  function saveForm(){
    var v = function(id){ var el = document.getElementById('f-' + id); return el ? String(el.value).trim() : ''; };
    var now = today().toISOString();
    if (form.type === 'bill') {
      var amount = num(v('amount'));
      if (!v('name') || amount == null || !v('due')) { form.problem = 'Give the bill a name, an amount and a due date.'; render(); return; }
      var provider = v('provider') || v('name');
      data.bills.push({ id: 'b' + Date.now(), provider: provider, name: v('provider') ? provider : v('name'), sub: v('provider') ? v('name') : '', amount: amount, due: v('due'), monthly: !!(document.getElementById('f-monthly') || {}).checked });
    } else {
      var bal = num(v('balance'));
      if (!v('institution') || bal == null) { form.problem = 'Give the account a company and a balance.'; render(); return; }
      var a = { id: 'm' + Date.now(), source: 'manual', kind: v('kind') || 'loan', institution: v('institution'), name: v('name') || v('institution'), balance: Math.abs(bal), updatedAt: now };
      if (a.kind === 'checking' || a.kind === 'savings' || a.kind === 'investment') a.balance = bal;
      var lim = num(v('limit')); if (lim != null && a.kind === 'credit') a.limit = lim;
      var apr = num(v('apr')); if (apr != null) a.apr = apr;
      var pay = num(v('payment')); if (pay != null && v('due')) a.payment = { amount: pay, due: v('due'), monthly: true };
      data.accounts.push(a);
    }
    form = null; snapshot(); save(); render();
  }
  // Paying a repeating bill moves it to next month; a one-off is marked paid.
  function markPaid(id){
    var t = isoDay(today());
    var b = data.bills.filter(function(x){ return x.id === id; })[0];
    var target = b || (data.accounts.filter(function(x){ return x.id === id; })[0] || {}).payment;
    if (!target) return;
    target.paidLog = (Array.isArray(target.paidLog) ? target.paidLog : []).concat([t]).slice(-36);
    if (target.monthly !== false) { target.lastPaid = t; target.due = addMonth(target.due); delete target.paid; }
    else target.paid = t;
    save(); render();
  }

  function drawChart(){
    var el = document.getElementById('chart'); if (!el) return;
    var hist = data.history;
    var n = { '1w': 7, '1m': 31, '3m': 92, '6m': 183, '1y': 365, 'all': 1e9 }[range];
    var cut = today() - n * DAY, pts = hist.filter(function(p){ return day(p.d) >= cut; });
    var sum = document.getElementById('chart-sum');
    if (pts.length < 2) { el.innerHTML = '<div class="empty">The chart fills in as days go by — one point each day the page checks your balances.</div>'; if (sum) sum.textContent = ''; return; }
    var vs = pts.map(function(p){ return p.v; }), diff = vs[vs.length - 1] - vs[0];
    if (sum) sum.textContent = (diff >= 0 ? 'Up ' : 'Down ') + money(Math.abs(diff), true) + ' since ' + short(day(pts[0].d));
    // Round gridlines (1, 2 or 5 × a power of ten) so labels read cleanly, and only as many as the height allows.
    var lo0 = Math.min.apply(null, vs), hi0 = Math.max.apply(null, vs), span = (hi0 - lo0) || Math.max(100, Math.abs(hi0) * 0.02);
    var raw = span / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(function(m){ return m * mag; }).filter(function(v){ return v >= raw; })[0];
    var lo = Math.floor((lo0 - span * 0.08) / step) * step, hi = Math.ceil((hi0 + span * 0.08) / step) * step;
    var k = function(v){
      var a = Math.abs(v), t = a >= 1000 ? (step >= 1000 ? Math.round(a / 1000) + 'k' : (a / 1000).toFixed(1).replace(/\.0$/, '') + 'k') : String(Math.round(a));
      return v < 0 ? '$(' + t + ')' : '$' + t;
    };
    var ticks = []; for (var tv = lo; tv <= hi + step / 2; tv += step) ticks.push(tv);
    var longest = ticks.reduce(function(m, v){ return Math.max(m, k(v).length); }, 0);
    // The left margin fits the widest label with a clear gap, instead of a fixed width the labels ran into.
    var W = el.clientWidth || 600, H = el.clientHeight || 190, L = 18 + longest * 7, R = 10, T = 10, B = 26;
    var x = function(i){ return L + (W - L - R) * i / (pts.length - 1); };
    var y = function(v){ return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Net worth over time"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".16"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><g class="grid axis">';
    ticks.forEach(function(v){ s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 12) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + k(v) + '</text>'; });
    // Date labels: as many as fit with room between them (about one per 110px), never overlapping.
    var nx = Math.max(1, Math.min(pts.length - 1, Math.floor((W - L - R) / 110)));
    var dlabel = range === '1w' ? function(d){ return d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }); } : short;
    for (var j = 0; j <= nx; j++) { var i = Math.round((pts.length - 1) * j / nx); s += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (j === 0 ? 'start' : j === nx ? 'end' : 'middle') + '">' + dlabel(day(pts[i].d)) + '</text>'; }
    s += '</g>';
    if (lo < 0 && hi > 0) s += '<line class="zero" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join('');
    s += '<path d="' + d + 'L' + x(pts.length - 1) + ' ' + (H - B) + 'L' + L + ' ' + (H - B) + 'Z" fill="url(#fill)" style="color:var(--fg)"/>';
    s += '<path class="line" d="' + d + '"/><line class="cross" id="cx" y1="' + T + '" y2="' + (H - B) + '" style="display:none"/><circle class="dot" id="cd" r="5" style="display:none"/></svg><div class="tip" id="tip" style="display:none"></div>';
    el.innerHTML = s;
    var svg = el.querySelector('svg'), cx = el.querySelector('#cx'), cd = el.querySelector('#cd'), tip = el.querySelector('#tip');
    svg.addEventListener('pointermove', function(e){
      var r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      var i = Math.max(0, Math.min(pts.length - 1, Math.round((px - L) / (W - L - R) * (pts.length - 1))));
      cx.setAttribute('x1', x(i)); cx.setAttribute('x2', x(i)); cx.style.display = '';
      cd.setAttribute('cx', x(i)); cd.setAttribute('cy', y(pts[i].v)); cd.style.display = '';
      tip.style.display = ''; tip.style.left = (x(i) * r.width / W) + 'px'; tip.style.top = (y(pts[i].v) * r.height / H) + 'px';
      tip.innerHTML = '<span class="muted">' + short(day(pts[i].d)) + '</span>&nbsp; <b class="num">' + money(pts[i].v, true) + '</b>';
    });
    svg.addEventListener('pointerleave', function(){ cx.style.display = cd.style.display = tip.style.display = 'none'; });
  }

  function save(){ if (window.youcoded) window.youcoded.save(data); }
  function on(sel, fn){ document.querySelectorAll(sel).forEach(function(el){ el.onclick = function(e){ fn(el, e); }; }); }
  function toggle(id){ openId = openId === id ? null : id; billEdit = null; limitEdit = null; payEdit = null; render(); }
  function focusAccount(id){
    openId = id; render();
    var el = document.querySelector('[data-open="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus({ preventScroll: true }); }
  }
  function wire(){
    // A card opens on a click anywhere but its own buttons, links and fields; Enter or Space opens it from the keyboard.
    document.querySelectorAll('[data-open]').forEach(function(el){
      el.onclick = function(e){ if (e.target.closest('button, a, input, select, .detail')) return; toggle(el.dataset.open); };
      el.onkeydown = function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); toggle(el.dataset.open); } };
    });
    document.querySelectorAll('[data-focus], .tap[data-jump]').forEach(function(el){
      el.onkeydown = function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); el.click(); } };
    });
    on('[data-focus]', function(el, e){ if (e.target.closest('button, a')) return; focusAccount(el.dataset.focus); });
    on('[data-limit]', function(b){ limitEdit = b.dataset.limit; render(); var i = document.getElementById('limit-val'); if (i) { i.focus(); i.select(); } });
    on('[data-limit-cancel]', function(){ limitEdit = null; render(); });
    on('[data-pay]', function(b){ payEdit = b.dataset.pay; render(); var i = document.getElementById('pay-amt'); if (i) i.focus(); });
    on('[data-pay-cancel]', function(){ payEdit = null; render(); });
    on('[data-pay-save]', function(b){
      var a = data.accounts.filter(function(x){ return x.id === b.dataset.paySave; })[0];
      var amt = num(document.getElementById('pay-amt').value), due = document.getElementById('pay-due').value, apr = num(document.getElementById('pay-apr').value);
      if (a) {
        if (amt != null && amt > 0 && due) a.payment = { amount: amt, due: due, monthly: true, manual: a.source === 'plaid' };
        if (apr != null) a.apr = apr;
      }
      payEdit = null; save(); render();
    });
    on('[data-limit-save]', function(b){
      var v = num(document.getElementById('limit-val').value);
      var a = data.accounts.filter(function(x){ return x.id === b.dataset.limitSave; })[0];
      if (a) { if (v && v > 0) a.limit = v; else delete a.limit; }
      limitEdit = null; save(); render();
    });
    on('[data-bill-edit]', function(b){ billEdit = b.dataset.billEdit; render(); });
    on('[data-bill-cancel]', function(){ billEdit = null; render(); });
    on('[data-bill-save]', function(b){
      var bill = data.bills.filter(function(x){ return x.id === b.dataset.billSave; })[0];
      var amt = num(document.getElementById('bill-amt').value), due = document.getElementById('bill-due').value;
      if (bill && amt != null && due) { bill.amount = amt; bill.due = due; delete bill.paid; }
      billEdit = null; save(); render();
    });
    on('[data-bill-delete]', function(b){ data.bills = data.bills.filter(function(x){ return x.id !== b.dataset.billDelete; }); openId = null; save(); render(); });
    on('[data-range]', function(b){ range = b.dataset.range; render(); });
    on('[data-bill-sort]', function(b){ billSort = b.dataset.billSort; render(); });
    on('[data-browser]', function(b, e){ e.stopPropagation(); data.settings.browser = b.dataset.browser; save(); render(); });
    on('[data-jump]', function(b){ var t = document.getElementById(b.dataset.jump); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    on('[data-edit]', function(b){ editing = b.dataset.edit; render(); var i = document.getElementById('edit-val'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); i.select(); } });
    on('[data-cancel]', function(){ editing = null; render(); });
    on('[data-save]', function(b){
      var v = num(document.getElementById('edit-val').value);
      if (v == null) return;
      var a = data.accounts.filter(function(x){ return x.id === b.dataset.save; })[0];
      a.balance = v; a.updatedAt = today().toISOString(); editing = null; snapshot(); save(); render();
    });
    on('[data-delete]', function(b){ data.accounts = data.accounts.filter(function(x){ return x.id !== b.dataset.delete; }); editing = null; snapshot(); save(); render(); });
    on('[data-paid]', function(b){ markPaid(b.dataset.paid); });
    on('[data-reconnect]', function(b){ reconnectBank(b.dataset.reconnect); });
    on('[data-check]', function(){ syncBanks(); });
    on('[data-ask-remove]', function(b){ removing = b.dataset.askRemove; render(); });
    on('[data-cancel-remove]', function(){ removing = null; render(); });
    on('[data-remove-bank]', function(b){ removeBank(b.dataset.removeBank); });
    on('[data-dismiss-note]', function(){ bankNote = null; render(); });
    on('[data-cancel-link]', function(){ cancelLink(); });
    on('[data-add]', function(b, e){
      e.stopPropagation(); menuOpen = false;
      var what = b.dataset.add;
      if (what === 'bank') { connectBank(); return; }
      form = { type: what === 'bill' ? 'bill' : 'account' }; render();
      var first = document.querySelector('.form-card input'); if (first) first.focus();
    });
    on('[data-form-cancel]', function(){ form = null; render(); });
    on('[data-form-save]', function(){ saveForm(); });
    var ev = document.getElementById('edit-val');
    if (ev) ev.onkeydown = function(e){ if (e.key === 'Enter') document.querySelector('[data-save]').click(); if (e.key === 'Escape') { e.preventDefault(); editing = null; render(); } };
    var add = document.getElementById('add'); if (add) add.onclick = function(e){ e.stopPropagation(); menuOpen = !menuOpen; render(); };
    var chk = document.getElementById('check'); if (chk) chk.onclick = function(){ syncBanks(); };
  }
  document.addEventListener('click', function(){ if (menuOpen) { menuOpen = false; render(); } });
  window.addEventListener('resize', drawChart);
  if (window.youcoded) {
    // A change from elsewhere (YouCoded updating a balance from chat, another window) redraws in place.
    window.youcoded.onData(function(d){ data = normalise(d); render(); });
    if (window.youcoded.onRefresh) window.youcoded.onRefresh(function(){ syncBanks(); });
  }
  render();
  // Live balances every time the page opens.
  if (plaidOn) syncBanks();
})();
</script>
</body></html>
