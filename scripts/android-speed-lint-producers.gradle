// Diagnostic proof only: configuration validation must cover generated assets
// consumed by release lint, not just assemble's eventual mergeAssets tasks.
gradle.projectsEvaluated {
    if (rootProject.findProperty('ciPackagingDependencies') != 'true') return
    def app = rootProject.project(':app')
    for (def variant : ['Release', 'ReleaseTest']) {
        def checked = 0
        for (def suffix : ['ReportModel', 'Model']) {
            def name = "generate${variant}LintVital${suffix}"
            def task = app.tasks.findByName(name)
            if (task == null) continue
            checked++
            // Raw explicit edges avoid resolving the task graph outside its lock.
            def dependencies = task.dependsOn.toString()
            assert dependencies.contains('bundleWebUi') : name + ' lacks web producer: ' + dependencies
            assert dependencies.contains('buildBackend') : name + ' lacks backend producer: ' + dependencies
            assert dependencies.contains("buildRuntime${variant}") : name + ' lacks native producer: ' + dependencies
        }
        assert checked > 0 : variant + ' has no recognized lint-vital model task; update the experiment proof'
    }
    println 'Release lint explicitly depends on generated web/backend/native asset producers.'
}
