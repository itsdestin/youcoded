name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      base:
        description: 'Beta base version (the run number is appended, e.g. 1.3.0-beta.26)'
        required: true
        default: '1.3.0-beta'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # WHY: every CI build used to inherit build.gradle.kts's hand-edited
      # versionCode 20 / versionName "1.2.4" — the May release — so every beta
      # APK on GitHub was byte-for-byte the same identity as v1.2.4: the About
      # screen lied, a phone could not tell a beta was newer, and Play would
      # reject the duplicate versionCode (found 2026-09-10, audit §6). Mirror of
      # desktop-test-build.yml's "Stamp beta version": the version name is the
      # tag for a tag build and <base>.<run_number> for a dispatched beta; the
      # versionCode is 100 + this workflow's own always-increasing run number
      # (25 runs when this landed, so the first stamped build is 126) — above
      # the hand-set 20, monotonic across betas AND tag releases because both
      # come through this one workflow, and it maps an installed build straight
      # back to its run in the Actions tab. Local builds keep the hand-set
      # values; they are never distributed.
      - name: Stamp version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="${{ inputs.base }}.${{ github.run_number }}"
          fi
          CODE=$((100 + ${{ github.run_number }}))
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${CODE}/; s/versionName = \"[^\"]+\"/versionName = \"${NAME}\"/" app/build.gradle.kts
          grep -nE 'versionCode|versionName' app/build.gradle.kts | head -2
          echo "APP_VERSION=${NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # build-web-ui.sh runs `npm run build` in desktop/, which invokes
      # electron-builder for every configured Linux target (AppImage + deb +
      # rpm + pacman), so this runner needs rpm + bsdtar even though Android
      # never consumes the installers. PR #98 added the pacman+rpm targets and
      # updated android-ci.yml and android-test-build.yml but NOT this file --
      # so the Android RELEASE workflow has been broken since 2026-05-20 and
      # nobody noticed, because v1.2.4 (18 May) is the last release cut.
      # Failure signature: bsdtar exit 127 inside fpm's pacman step.
      #   libarchive-tools -> provides bsdtar (pacman target)
      #   rpm              -> provides rpmbuild (rpm target)
      - name: Install Linux build deps
        # `apt-get update` prefix: the cached package index on ubuntu-latest
        # often points to .deb versions that have rolled off the mirror, so
        # a bare install hits HTTP 404 / exit 100. Refresh the index first.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Build React UI
        run: ./scripts/build-web-ui.sh

      - name: Create keystore.properties
        run: |
          echo "storeFile=release-keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=youcoded" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      # WHY: Gradle names every output app-release.*; the beta APKs were being
      # renamed by hand at upload time (and lost their number: "1.3.0-beta.apk").
      - name: Name outputs after the version
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/YouCoded-${APP_VERSION}.apk"
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/YouCoded-${APP_VERSION}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
