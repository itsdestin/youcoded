name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      base:
        description: 'Next-patch beta prefix; leave blank to select it automatically. Beta numbers reset after each official release.'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/beta-version
        if: github.event_name == 'workflow_dispatch'
        id: beta
        with:
          base: ${{ inputs.base }}

      # WHY: visible beta numbers reset after each official release, but Android's
      # internal versionCode must keep increasing across both betas and releases.
      # Tagged builds keep the exact tag version and never resolve a beta.
      - name: Stamp version
        shell: bash
        env:
          BETA_VERSION: ${{ steps.beta.outputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="$BETA_VERSION"
          fi
          CODE=$((100 + ${{ github.run_number }}))
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${CODE}/; s/versionName = \"[^\"]+\"/versionName = \"${NAME}\"/" app/build.gradle.kts
          grep -nE 'versionCode|versionName' app/build.gradle.kts | head -2
          echo "APP_VERSION=${NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # The app's bundled programs (app/runtime/build-runtime.sh) are cross-built with clang + lld and
      # assembled from pinned downloads, cached by their pins (Android clean rebuild, 2026-10-14).
      - name: Install runtime build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld
      - name: Test runtime redistribution fixtures
        run: python3 -m unittest discover -s app/runtime -p 'test_*.py' -v
      # Alpine owns APK version ordering; do not approximate it with semver.
      - name: Configure APK version comparator
        run: |
          docker pull alpine:3.24
          echo 'YOUCODED_APK_VERSION=docker run --rm alpine:3.24 apk version -t' >> "$GITHUB_ENV"
      - name: Cache runtime downloads
        uses: actions/cache@v6
        with:
          path: app/build/runtime-cache
          key: android-runtime-${{ hashFiles('app/runtime/pins.env') }}

      # build-web-ui.sh runs `npm run build` in desktop/, which invokes
      # electron-builder for every configured Linux target (AppImage + deb +
      # rpm + pacman), so this runner needs rpm + bsdtar even though Android
      # never consumes the installers. PR #98 added the pacman+rpm targets and
      # updated android-ci.yml and android-test-build.yml but NOT this file --
      # so the Android RELEASE workflow has been broken since 2026-05-20 and
      # nobody noticed, because v1.2.4 (18 May) is the last release cut.
      # Failure signature: bsdtar exit 127 inside fpm's pacman step.
      #   libarchive-tools -> provides bsdtar (pacman target)
      #   rpm              -> provides rpmbuild (rpm target)
      - name: Install Linux build deps
        # `apt-get update` prefix: the cached package index on ubuntu-latest
        # often points to .deb versions that have rolled off the mirror, so
        # a bare install hits HTTP 404 / exit 100. Refresh the index first.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Build React UI
        run: ./scripts/build-web-ui.sh

      - name: Create keystore.properties
        run: |
          echo "storeFile=release-keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=youcoded" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      - name: Check runtime license preservation
        run: python3 -m unittest discover -s app/runtime -p 'test_*.py'

      - name: Run unit tests
        run: ./gradlew test

      # WHY: exact aports sources are collected after resolution and version stamping,
      # before packaging their notices. No hand-authored dossier prerequisite.
      - name: Build release APK and AAB
        env:
          YOUCODED_COLLECT_SOURCES: '1'
        run: ./gradlew assembleRelease bundleRelease

      - name: Retain automated source collection even when release remains blocked
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-runtime-source-collection-incomplete
          path: |
            app/build/runtime/release/evidence
            app/build/runtime/release/sources
          if-no-files-found: warn
          retention-days: 30

      # WHY: Gradle names every output app-release.*; the beta APKs were being
      # renamed by hand at upload time (and lost their number: "1.3.0-beta.apk").
      - name: Name outputs after the version
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/YouCoded-${APP_VERSION}.apk"
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/YouCoded-${APP_VERSION}.aab"

      # Actual collection residuals block distribution; arbitrary review files cannot clear them.
      - name: Gate redistribution and assemble matching source archive
        run: |
          python3 -I app/runtime/runtime-redistribution.py bind_backend \
            app/build/runtime/release/sources app/build/backend-assets/backend.tgz
          python3 -I app/runtime/runtime-redistribution.py release \
            app/build/runtime/release app/build/runtime/release/sources \
            "app/build/outputs/YouCoded-${APP_VERSION}-android-corresponding-source.tar.xz" \
            "app/build/outputs/apk/release/YouCoded-${APP_VERSION}.apk" \
            "app/build/outputs/bundle/release/YouCoded-${APP_VERSION}.aab"

      - name: Upload corresponding source artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-android-corresponding-source
          path: |
            app/build/outputs/*-android-corresponding-source.tar.xz
            app/build/outputs/*-android-corresponding-source.tar.xz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/*-android-corresponding-source.tar.xz
            app/build/outputs/*-android-corresponding-source.tar.xz.sha256
          body: |
            Android runtime corresponding source, patches, build inputs and instructions:
            download YouCoded-${{ env.APP_VERSION }}-android-corresponding-source.tar.xz
            beside the matching APK/AAB on this release. The automatic GitHub app-only
            source archives do not replace this runtime source archive.
          generate_release_notes: true
