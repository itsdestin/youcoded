name: Android CI

on:
  # WHY: Desktop CI owns PR/master routing and cancellation. A second push/PR
  # trigger would run the old full Android control beside the integrated run.
  workflow_call:
  workflow_dispatch:
    inputs:
      collect_sources:
        description: 'Exercise exact runtime source/notice collection on the R8 test build'
        type: boolean
        default: false

jobs:
  # WHY: JVM validation has no packaging/native prerequisites; neither APK
  # waits for it or for another variant's runner/cache to become available.
  jvm:
    if: '!inputs.collect_sources'
    runs-on: ubuntu-latest
    env:
      CI_GRADLE_FLAGS: -PciPackagingDependencies=true --init-script scripts/ci-android-producers.gradle -Dorg.gradle.jvmargs=-Xmx2g --no-build-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
      - name: Record current Android input identity
        run: node scripts/ci-inputs.mjs start
      - name: Test runtime redistribution fixtures
        run: python3 -m unittest discover -s app/runtime -p 'test_*.py' -v
      - name: Verify all variant lint producer graphs
        run: ./gradlew lintDebug lintReleaseTest lintRelease --dry-run $CI_GRADLE_FLAGS
      - name: Run unit tests
        run: ./gradlew test $CI_GRADLE_FLAGS
      - name: Verify current JVM inputs and outputs
        run: node scripts/ci-inputs.mjs jvm
      - name: Upload JVM input evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: android-scope-jvm
          path: ci-android-evidence.json
          if-no-files-found: error
          retention-days: 7

  apk:
    if: '!inputs.collect_sources'
    name: Android APK (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [debug, releaseTest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # WHY: only modeled APK compiler outputs may be restored; JVM tests and
      # the serial source preflight explicitly execute without task caching.
      CI_GRADLE_FLAGS: -PciPackagingDependencies=true --init-script scripts/ci-android-producers.gradle -Dorg.gradle.jvmargs=-Xmx2g --build-cache
      CI_ANDROID_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Record current Android input identity
        run: node scripts/ci-inputs.mjs start
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
        with:
          # WHY: owned PRs can populate their PR-scoped compiler cache; fork
          # PRs only read. JVM/source keep setup-gradle's default write policy.
          cache-read-only: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Install runtime build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld
      - name: Configure APK version comparator
        run: |
          docker pull alpine:3.24
          echo 'YOUCODED_APK_VERSION=docker run --rm alpine:3.24 apk version -t' >> "$GITHUB_ENV"
      - name: Cache runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: app/build/runtime-cache
          key: android-runtime-${{ hashFiles('app/runtime/pins.env') }}
      # WHY: compiled native work remains fresh and confined to this run,
      # attempt and variant; custom Exec producers are not task-cacheable.
      - name: Configure run-local native cache
        run: echo "YOUCODED_COMMON_NATIVE_CACHE=$RUNNER_TEMP/ci-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CI_ANDROID_SCOPE}" >> "$GITHUB_ENV"
      # WHY: fixed mapping, not arbitrary task input. ReleaseTest still requests
      # R8 with debug signing; FROM-CACHE is restoration, not fresh execution.
      - name: Build scoped APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$CI_ANDROID_SCOPE" in
            debug) task=assembleDebug ;;
            releaseTest) task=assembleReleaseTest ;;
            *) echo "Unknown Android scope: $CI_ANDROID_SCOPE" >&2; exit 1 ;;
          esac
          ./gradlew "$task" $CI_GRADLE_FLAGS --console=plain 2>&1 | tee "$RUNNER_TEMP/android-gradle-${CI_ANDROID_SCOPE}.log"
      # WHY: keep small task facts even when Gradle fails. Neither this helper
      # nor tee can turn a failed assembly into a successful job.
      - name: Record Gradle task outcomes
        if: always()
        run: node scripts/ci-gradle-outcomes.mjs "$CI_ANDROID_SCOPE" "$RUNNER_TEMP/android-gradle-${CI_ANDROID_SCOPE}.log"
      - name: Upload Gradle task outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: android-gradle-outcomes-${{ matrix.scope }}
          path: ${{ runner.temp }}/android-gradle-outcomes-${{ matrix.scope }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify current scoped Android inputs and outputs
        run: node scripts/ci-inputs.mjs "$CI_ANDROID_SCOPE"
      - name: Upload scoped Android input evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: android-scope-${{ matrix.scope }}
          path: ci-android-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug APK
        if: matrix.scope == 'debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: youcoded-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload releaseTest APK
        if: matrix.scope == 'releaseTest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: youcoded-releasetest
          path: app/build/outputs/apk/releaseTest/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  source-preflight:
    if: inputs.collect_sources
    name: Android source preflight
    runs-on: ubuntu-latest
    env:
      # WHY: Android builds the web/backend, never the Electron executable.
      # Keep npm lifecycle scripts enabled; only omit Electron's binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}

      # WHY: source preflight deliberately retains the serial default producer
      # graph, with neither CI packaging opt-in nor compiled native cache.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Explicit Node setup — bundleWebUi (Gradle preBuild dep) shells out
      # to `npm` via scripts/build-web-ui.sh. ubuntu-latest happens to
      # ship a node binary today, but pinning here removes the runner-
      # image dep so CI doesn't silently drift if the image changes.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Record current Android input identity
        run: node scripts/ci-inputs.mjs start

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6
      # The app's bundled programs (app/runtime/build-runtime.sh) are cross-built with clang + lld and
      # assembled from pinned downloads, cached by their pins (Android clean rebuild, 2026-10-14).
      - name: Install runtime build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld
      - name: Test runtime redistribution fixtures
        run: python3 -m unittest discover -s app/runtime -p 'test_*.py' -v
      - name: Configure APK version comparator
        run: |
          docker pull alpine:3.24
          echo 'YOUCODED_APK_VERSION=docker run --rm alpine:3.24 apk version -t' >> "$GITHUB_ENV"
      - name: Cache runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: app/build/runtime-cache
          key: android-runtime-${{ hashFiles('app/runtime/pins.env') }}

      # bundleWebUi (a Gradle dep of preBuild) shells out to
      # scripts/build-web-ui.sh, which since 2026-09-16 runs `npm run build:web`
      # — the web bundle only. It used to run the full desktop build, so this
      # job needed rpm + bsdtar for installers it never used and went red
      # whenever desktop packaging did (2026-05-20 to 06). Desktop CI still
      # builds every installer on its Linux leg.

      - name: Run unit tests
        run: ./gradlew test --no-build-cache

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-build-cache

      # ReleaseTest: same R8 minification + shrinker + proguard rules as
      # the production release flavor, but signed with the debug keystore
      # so it can run without the release-keystore secrets.
      #
      # Why this lives in dev CI (not just release): debug builds skip R8
      # entirely, hiding any bug whose trigger involves R8 obfuscation,
      # shrinking, or inlining. The PluginInstaller reflection footgun
      # (912f5ca7) shipped silently from 2026-03-25 through v1.2.2
      # because every dev/CI build was debug — pre-release verification
      # never ran the same code path the user would. Building releaseTest
      # on every push catches that whole bug class at PR time.
      - name: Build releaseTest APK (R8 minified, debug-signed)
        env:
          YOUCODED_COLLECT_SOURCES: ${{ inputs.collect_sources && '1' || '0' }}
        run: ./gradlew assembleReleaseTest --no-build-cache

      - name: Verify packaged runtime and source archive
        if: inputs.collect_sources
        run: |
          python3 -I app/runtime/runtime-redistribution.py bind_backend \
            app/build/runtime/releaseTest/sources app/build/backend-assets/backend.tgz
          python3 -I app/runtime/runtime-redistribution.py release \
            app/build/runtime/releaseTest app/build/runtime/releaseTest/sources \
            app/build/outputs/android-source-preflight.tar.xz \
            app/build/outputs/apk/releaseTest/*.apk

      - name: Upload inspected source preflight archive
        if: inputs.collect_sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: android-source-preflight-archive
          path: |
            app/build/outputs/android-source-preflight.tar.xz
            app/build/outputs/android-source-preflight.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

      # WHY: retain raw evidence only on failure, not a duplicate of a successful
      # source archive. Nothing here tags or publishes a GitHub Release.
      - name: Retain source preflight evidence
        if: always() && inputs.collect_sources && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: android-source-preflight
          path: |
            app/build/runtime/releaseTest/evidence
            app/build/runtime/releaseTest/sources
          if-no-files-found: warn
          retention-days: 7

      - name: Verify current Android inputs and outputs
        run: node scripts/ci-inputs.mjs android

      - name: Upload Android input evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: android-current-inputs
          path: ci-android-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: youcoded-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload releaseTest APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: youcoded-releasetest
          path: app/build/outputs/apk/releaseTest/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # WHY: always inspect the complete needs tuple, including skipped/cancelled
  # producers, before accepting evidence. The parent still gates this workflow.
  completion:
    if: always()
    needs: [jvm, apk, source-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
      - name: Test Android completion policy
        run: node --test scripts/ci-android-policy.test.mjs
      - name: Require selected Android producers
        env:
          CI_ANDROID_NEEDS: ${{ toJSON(needs) }}
          CI_COLLECT_SOURCES: ${{ inputs.collect_sources == true }}
        run: node scripts/ci-android-policy.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: '!inputs.collect_sources'
        with:
          pattern: android-scope-*
          path: ci-android-results
      - name: Aggregate current Android inputs and outputs
        if: '!inputs.collect_sources'
        run: node scripts/ci-inputs.mjs aggregate
      - name: Upload Android input evidence
        if: '!inputs.collect_sources'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: android-current-inputs
          path: ci-android-evidence.json
          if-no-files-found: error
          retention-days: 7
