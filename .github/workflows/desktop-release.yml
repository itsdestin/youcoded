name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't cancel in-flight builds if one platform fails, so every platform's
      # result is visible. NOTE: this does NOT ship 2/3 platforms - the `upload` job
      # below needs every build leg green, so one red leg (including the macOS
      # signature check) withholds the whole GitHub release. That is deliberate: a
      # release with a broken Mac dmg is worse than a release that waits a day.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop/release/*.exe
            name: windows
          - os: macos-latest
            artifact: desktop/release/*.dmg
            name: macos
          - os: ubuntu-latest
            artifact: |
              desktop/release/*.AppImage
              desktop/release/*.deb
              desktop/release/*.rpm
              desktop/release/*.pacman
            name: linux

    runs-on: ${{ matrix.os }}
    # WHY (Windows signing, 2026-10-01): only the Windows leg of a tagged release or a
    # master run signs. Azure trusts GitHub's sign-in ONLY from jobs in the
    # windows-signing environment (one federated credential, subject
    # environment:windows-signing, so no Azure password lives in GitHub), and that
    # environment only admits master and v* tags. Every other leg/run gets no
    # environment and builds exactly as before.
    environment: ${{ (matrix.name == 'windows' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')) && 'windows-signing' || '' }}
    env:
      SIGN_WINDOWS: ${{ matrix.name == 'windows' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master') }}
    permissions:
      contents: write
      # Lets azure/login trade GitHub's short-lived OIDC token for Azure access.
      id-token: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e "var p=require('path').resolve('package.json'),pkg=JSON.parse(require('fs').readFileSync(p,'utf8'));pkg.version=process.argv[1];require('fs').writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')" "$TAG_VERSION"
          echo "Set desktop/package.json version to $TAG_VERSION"

      - name: Install dependencies
        run: npm ci

      # Keep in sync with desktop-test-build.yml's identical step.
      # macos-latest runners are arm64, so `npm ci` installs only the darwin-arm64
      # variant of any package that ships its binaries as per-platform
      # optionalDependencies. electron-builder cuts BOTH the x64 and arm64 dmgs from
      # this single node_modules tree (npmRebuild is false), so without this step the
      # x64 dmg ships arm64 binaries: ripgrep throws "Could not find
      # @vscode/ripgrep-darwin-x64" and kills the main process at launch, and
      # @napi-rs/canvas (a pdfjs-dist dep) breaks PDF rendering. --force bypasses the
      # os/cpu guard that would otherwise skip a foreign-arch package. Versions are
      # read from the installed tree so a dependency bump can't silently desync them.
      - name: Add darwin-x64 binaries for the x64 dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          # Read package.json off disk rather than require()-ing it: @vscode/ripgrep
          # declares an "exports" map that only exposes ".", so requiring the
          # subpath fails with ERR_PACKAGE_PATH_NOT_EXPORTED.
          ver() { node -p "JSON.parse(require('fs').readFileSync('node_modules/$1/package.json','utf8')).version"; }
          RG=$(ver @vscode/ripgrep)
          CANVAS=$(ver @napi-rs/canvas)
          npm i --no-save --force \
            "@vscode/ripgrep-darwin-x64@$RG" \
            "@napi-rs/canvas-darwin-x64@$CANVAS"

      # WHY before the tests (Task 9): the Office tests that run the real converter skip when no
      # add-on is installed, so without this they ran on Linux developer machines only. Fetching
      # this runner's own bundle runs them on Windows and macOS too — the only place a Windows or
      # Mac converter problem shows before a user meets it.
      - name: Fetch the Office add-on
        run: node scripts/fetch-office.mjs --required

      - name: Run tests
        run: npm test

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # Must run BEFORE the build — electron-builder's deb/rpm/pacman
        # packagers run inside `npm run build`:
        #   libarchive-tools -> provides bsdtar, required by the pacman target
        #   rpm              -> required by the rpm target
        #   xvfb             -> headless display for the smoke test below
        run: sudo apt-get install -y xvfb rpm libarchive-tools
        working-directory: .

      # Keep these three Windows-signing steps and the Build/verify pair in sync with
      # desktop-test-build.yml. Fails loudly when the environment's variables are
      # missing: an unsigned installer must never ship as if it were signed.
      - name: Check Windows signing is configured
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::The windows-signing environment is missing AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID, so the Windows installer cannot be signed. See docs/build-and-release.md (youcoded-dev) → Windows signing."
            exit 1
          fi

      - name: Sign in to Azure for Windows signing
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # WHY fetch the signing token here: GitHub's sign-in token is only good for a few
      # minutes, and electron-builder asks Azure for a signing token only when it
      # reaches the first file. Fetching it now caches it in the Azure CLI (about an
      # hour), which the signing module reuses for every file.
      - name: Fetch the Windows signing token
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: az account get-access-token --scope https://codesigning.azure.net/.default -o none

      - name: Build
        shell: bash
        run: |
          if [ "$SIGN_WINDOWS" = "true" ]; then
            # WHY a second config: see electron-builder.win-sign.yml. `--` hands the flag
            # to the electron-builder call that ends the build script.
            npm run build -- --config electron-builder.win-sign.yml
          else
            npm run build
          fi

      # WHY: a build can finish with a file silently left unsigned. Windows' own check
      # is the verdict: the installer and the app it installs must both carry a
      # valid signature, or the release is held back.
      - name: Verify the Windows installer is signed
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-ChildItem release/*.exe) + @(Get-Item release/win-unpacked/YouCoded.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            Write-Host "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { Write-Error 'A Windows file is not validly signed.'; exit 1 }

      # WHY: electron-builder SILENTLY skips macOS signing when it cannot sign, and a
      # Dependabot bump did exactly that on 2026-07-23 - six weeks of unopenable Mac
      # builds with every check green. The script (shared with the other mac workflow,
      # so betas and releases are held to one standard) explains the rest.
      - name: Verify the macOS bundle is signed
        if: matrix.name == 'macos'
        shell: bash
        run: bash scripts/verify-mac-signature.sh

      # WHY (final review, 2026-09-30): nothing else ever runs the Office converter INSIDE the
      # packaged app — the copy electron-builder re-signed, and for the Intel dmg one from a
      # different bundle than this runner's. This checks each app's x2t and dylibs are for its
      # dmg's CPU, then opens, saves and exports a docx as PDF with them through the app's own
      # x2t code (dist/main/office/x2t.js). The Intel copy runs under Rosetta when the runner has it.
      - name: Run the packaged Office converter
        if: matrix.name == 'macos'
        shell: bash
        run: node scripts/office-packaged-smoke.mjs release

      - name: Smoke test
        # Launch the production build briefly and verify no renderer crash.
        # Uses xvfb on Linux since there's no display server in CI.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/smoke-test.js
          else
            node scripts/smoke-test.js
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Signed release manifest (2026-09-10 security review, #7). Computes each
      # installer's SHA-256 + size, writes youcoded-release.json, and signs it
      # with the ed25519 release key so the in-app updater can prove a download is
      # genuine before running it.
      #
      # NON-FATAL on purpose: a signing problem must not hold back the installers
      # the website hands out. The release then ships WITHOUT a manifest, the
      # in-app Update button refuses it, and the fix is signing it by hand
      # (docs/build-and-release.md in youcoded-dev → Release flows). The repository
      # secret UPDATE_SIGNING_KEY (the PKCS8 PEM private key from
      # ~/system/youcoded-release-signing/) has been set since 2026-09-11, and every
      # master beta build signs with it first (desktop-test-build.yml `sign`), so a
      # warning here should never be the first news of a bad key.
      # --verify-with writes nothing unless the signature verifies against the
      # public key built into the app: a manifest signed with the wrong key would
      # be refused exactly like a missing one, just more confusingly.
      - name: Sign release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set — shipping WITHOUT a signed manifest. The in-app updater will refuse this release until it is signed."
            exit 0
          fi
          if ! node scripts/generate-release-manifest.mjs --dir "$GITHUB_WORKSPACE/artifacts" --version "$GITHUB_REF_NAME" --verify-with src/main/update-signing-key.ts; then
            echo "::warning::The manifest did not verify against the app's built-in public key — shipping WITHOUT a signed manifest. The in-app updater will refuse this release until it is signed."
          fi

      - name: Upload installers to release
        uses: softprops/action-gh-release@v3
        with:
          # Includes youcoded-release.json + .sig when signing ran above.
          files: artifacts/**/*
