name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't cancel in-flight builds if one platform fails, so every platform's
      # result is visible. NOTE: this does NOT ship 2/3 platforms - the `upload` job
      # below needs every build leg green, so one red leg (including the macOS
      # signature check) withholds the whole GitHub release. That is deliberate: a
      # release with a broken Mac dmg is worse than a release that waits a day.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop/release/*.exe
            name: windows
          - os: macos-latest
            artifact: desktop/release/*.dmg
            name: macos
          - os: ubuntu-latest
            artifact: |
              desktop/release/*.AppImage
              desktop/release/*.deb
              desktop/release/*.rpm
              desktop/release/*.pacman
            name: linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e "var p=require('path').resolve('package.json'),pkg=JSON.parse(require('fs').readFileSync(p,'utf8'));pkg.version=process.argv[1];require('fs').writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')" "$TAG_VERSION"
          echo "Set desktop/package.json version to $TAG_VERSION"

      - name: Install dependencies
        run: npm ci

      # Keep in sync with desktop-test-build.yml's identical step.
      # macos-latest runners are arm64, so `npm ci` installs only the darwin-arm64
      # variant of any package that ships its binaries as per-platform
      # optionalDependencies. electron-builder cuts BOTH the x64 and arm64 dmgs from
      # this single node_modules tree (npmRebuild is false), so without this step the
      # x64 dmg ships arm64 binaries: ripgrep throws "Could not find
      # @vscode/ripgrep-darwin-x64" and kills the main process at launch, and
      # @napi-rs/canvas (a pdfjs-dist dep) breaks PDF rendering. --force bypasses the
      # os/cpu guard that would otherwise skip a foreign-arch package. Versions are
      # read from the installed tree so a dependency bump can't silently desync them.
      - name: Add darwin-x64 binaries for the x64 dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          # Read package.json off disk rather than require()-ing it: @vscode/ripgrep
          # declares an "exports" map that only exposes ".", so requiring the
          # subpath fails with ERR_PACKAGE_PATH_NOT_EXPORTED.
          ver() { node -p "JSON.parse(require('fs').readFileSync('node_modules/$1/package.json','utf8')).version"; }
          RG=$(ver @vscode/ripgrep)
          CANVAS=$(ver @napi-rs/canvas)
          npm i --no-save --force \
            "@vscode/ripgrep-darwin-x64@$RG" \
            "@napi-rs/canvas-darwin-x64@$CANVAS"

      - name: Run tests
        run: npm test

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # Must run BEFORE the build — electron-builder's deb/rpm/pacman
        # packagers run inside `npm run build`:
        #   libarchive-tools -> provides bsdtar, required by the pacman target
        #   rpm              -> required by the rpm target
        #   xvfb             -> headless display for the smoke test below
        run: sudo apt-get install -y xvfb rpm libarchive-tools
        working-directory: .

      - name: Build
        run: npm run build

      # WHY: electron-builder SILENTLY skips macOS signing when it cannot sign, and a
      # Dependabot bump did exactly that on 2026-07-23 - six weeks of unopenable Mac
      # builds with every check green. The script (shared with the other mac workflow,
      # so betas and releases are held to one standard) explains the rest.
      - name: Verify the macOS bundle is signed
        if: matrix.name == 'macos'
        shell: bash
        run: bash scripts/verify-mac-signature.sh

      - name: Smoke test
        # Launch the production build briefly and verify no renderer crash.
        # Uses xvfb on Linux since there's no display server in CI.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/smoke-test.js
          else
            node scripts/smoke-test.js
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Signed release manifest (2026-09-10 security review, #7). Computes each
      # installer's SHA-256 + size, writes youcoded-release.json, and signs it
      # with the ed25519 release key so the in-app updater can prove a download is
      # genuine before running it.
      #
      # NON-FATAL if the key isn't configured yet: the release still ships, just
      # WITHOUT a manifest — and the updater (which requires one) will refuse to
      # install this release until it's signed. Set the repository/environment
      # secret UPDATE_SIGNING_KEY (the PKCS8 PEM private key from
      # ~/system/youcoded-release-signing/) to activate signing. Ideally scope it
      # to a protected `release` environment.
      - name: Sign release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set — shipping WITHOUT a signed manifest. The in-app updater will refuse this release until it is signed."
            exit 0
          fi
          node scripts/generate-release-manifest.mjs --dir "$GITHUB_WORKSPACE/artifacts" --version "$GITHUB_REF_NAME"

      - name: Upload installers to release
        uses: softprops/action-gh-release@v3
        with:
          # Includes youcoded-release.json + .sig when signing ran above.
          files: artifacts/**/*
