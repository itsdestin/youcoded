name: Website

# Publishes the website (docs/) and, on every publish, rebuilds its live demo (docs/site) and the
# demo's stills (docs/media/embed-*) from the NEWEST OFFICIAL RELEASE -- so the demo always shows the
# app people download, with nothing to remember at release time (Destin, 2026-10-21).
# Runs when the site changes on master, after every successful Desktop Release (the last platform to
# finish uploading), and on demand. The committed docs/site is only the fallback copy; this job
# replaces it in what it publishes. Requires Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [master]
    # The four root Markdown files are the source of privacy/terms/security/changelog.html.
    paths: ['docs/**', 'PRIVACY.md', 'TERMS.md', 'SECURITY.md', 'CHANGELOG.md', '.github/workflows/site-deploy.yml']
  # A pull request touching the site builds and checks it (never publishes), so a broken demo or
  # download script is caught before it merges.
  pull_request:
    paths: ['docs/**', 'PRIVACY.md', 'TERMS.md', 'SECURITY.md', 'CHANGELOG.md', '.github/workflows/site-deploy.yml']
  workflow_run:
    workflows: ['Desktop Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and a newer one never cancels a publish halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # the release tags
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
      - name: Find the newest official release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # /releases/latest never returns a pre-release or a draft.
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building the demo from $tag"
      - name: Check out that release's app
        # WHY env (security audit): the tag name comes from the GitHub API; keep it out of the script text.
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git worktree add --detach "$RUNNER_TEMP/app" "$RELEASE_TAG"
      - name: Install the release's app dependencies
        working-directory: ${{ runner.temp }}/app/desktop
        env:
          # The demo is a web build: Electron's runtime download is not needed.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build the live demo
        working-directory: ${{ runner.temp }}/app/desktop
        run: npm run build:site
      - name: Put the demo in the site
        run: rsync -a --delete "$RUNNER_TEMP/app/docs/site/" docs/site/
      - name: Shoot the demo's stills
        run: node docs/tools/embed-stills.mjs docs
      - name: Reuse the release's app dependencies
        # The page generator and site tests load react/jsdom from desktop/node_modules.
        run: ln -s "$RUNNER_TEMP/app/desktop/node_modules" desktop/node_modules
      - name: Rebuild the text pages from their Markdown
        # WHY: every release edits CHANGELOG.md (outside docs/), so a committed changelog.html
        # would fall a release behind with nothing to flag it. Regenerate on every publish.
        run: node docs/tools/gen-legal-pages.mjs
      - name: Check the site's own scripts
        run: node --test docs/tools/*.test.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: docs

  deploy:
    needs: build
    # Pull requests and runs on other branches build and check only; the site publishes from master.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5