name: Desktop Test Build

on:
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Optional X.Y.Z-beta prefix. Leave blank to use the next feature release
          after the latest official release (1.3.1 → 1.4.0-beta.1).
          Beta numbers restart at 1 after each feature release (X.Y.0), not after
          a bug-fix release. An explicit prefix must match that beta line.
        required: false
        default: ''
      skip_windows_tests:
        description: >-
          Skip `npm test` on the Windows leg only, so a Windows installer still gets built while
          master's Windows tests are red for a reason that is not this build's. macOS and Linux
          always run the tests. Leave it off for any build someone will rely on.
        type: boolean
        required: false
        default: false

jobs:
  # WHY: resolve once so every OS and the signature use exactly the same identity.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.beta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/beta-version
        id: beta
        with:
          base: ${{ inputs.base }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop/release/*.exe
            name: windows
          - os: macos-latest
            artifact: desktop/release/*.dmg
            name: macos
          - os: ubuntu-latest
            # Mirrors desktop-release.yml. electron-builder.yml has built all
            # four Linux targets since #98, but this workflow kept globbing only
            # the AppImage — so a beta silently discarded the deb/rpm/pacman it
            # had just built, and they were untestable before a release carried
            # them (#98 postdates the v1.2.4 tag, so none ever has).
            artifact: |
              desktop/release/*.AppImage
              desktop/release/*.deb
              desktop/release/*.rpm
              desktop/release/*.pacman
            name: linux

    runs-on: ${{ matrix.os }}
    # WHY: master betas sign their Windows installer exactly like a release, so the
    # signing setup is proven on every beta long before a release depends on it, and
    # beta testers stop seeing the SmartScreen wall. Other branches build unsigned
    # (the windows-signing environment only admits master and v* tags).
    # Mirrors desktop-release.yml.
    # WHY: Mac credentials follow the same boundary as Windows credentials; the
    # macos-signing environment independently refuses any non-master branch.
    environment: ${{ (matrix.name == 'windows' && github.ref == 'refs/heads/master') && 'windows-signing' || (matrix.name == 'macos' && github.ref == 'refs/heads/master') && 'macos-signing' || '' }}
    env:
      SIGN_WINDOWS: ${{ matrix.name == 'windows' && github.ref == 'refs/heads/master' }}
      SIGN_MACOS: ${{ matrix.name == 'macos' && github.ref == 'refs/heads/master' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    permissions:
      contents: read
      # Lets azure/login trade GitHub's short-lived OIDC token for Azure access.
      id-token: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Mirrors desktop-release.yml's "Sync version from tag". Without this the
      # build inherits package.json's version — the LAST RELEASED one — so a test
      # build is indistinguishable from the real release in Settings → About, in
      # analytics (analytics-service.ts reports app.getVersion()), and in bug
      # reports. Both __APP_VERSION__ and app.getVersion() derive from this file,
      # so stamping it here fixes every surface at once.
      # WHY: the lifetime Actions counter never resets; the version job scopes it
      # to the last official release and automatically advances the beta line.
      - name: Stamp beta version
        shell: bash
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "var p=require('path').resolve('package.json'),pkg=JSON.parse(require('fs').readFileSync(p,'utf8'));pkg.version=process.argv[1];require('fs').writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')" "$BETA_VERSION"
          echo "Set desktop/package.json version to $BETA_VERSION"

      - name: Install dependencies
        run: npm ci

      # macos-latest runners are arm64, so `npm ci` installs only the darwin-arm64
      # variant of any package that ships its binaries as per-platform
      # optionalDependencies. electron-builder cuts BOTH the x64 and arm64 dmgs from
      # this single node_modules tree (npmRebuild is false), so without this step the
      # x64 dmg ships arm64 binaries: ripgrep throws "Could not find
      # @vscode/ripgrep-darwin-x64" and kills the main process at launch, and
      # @napi-rs/canvas (a pdfjs-dist dep) breaks PDF rendering. --force bypasses the
      # os/cpu guard that would otherwise skip a foreign-arch package. Versions are
      # read from the installed tree so a dependency bump can't silently desync them.
      - name: Add darwin-x64 binaries for the x64 dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          # Read package.json off disk rather than require()-ing it: @vscode/ripgrep
          # declares an "exports" map that only exposes ".", so requiring the
          # subpath fails with ERR_PACKAGE_PATH_NOT_EXPORTED.
          ver() { node -p "JSON.parse(require('fs').readFileSync('node_modules/$1/package.json','utf8')).version"; }
          RG=$(ver @vscode/ripgrep)
          CANVAS=$(ver @napi-rs/canvas)
          npm i --no-save --force \
            "@vscode/ripgrep-darwin-x64@$RG" \
            "@napi-rs/canvas-darwin-x64@$CANVAS"

      # WHY before the tests (Task 9): the Office tests that run the real converter skip when no
      # add-on is installed, so without this they ran on Linux developer machines only. Fetching
      # this runner's own bundle runs them on Windows and macOS too — the only place a Windows or
      # Mac converter problem shows before a user meets it.
      - name: Check Mac signing keychain
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          # WHY: v26.15.3 uses the wrong password for partition access. Apply the
          # guarded upstream correction, then prove native signing before tests.
          node scripts/patch-mac-signing-keychain.mjs
          node scripts/check-mac-signing-keychain.mjs

      - name: Fetch the Office add-on
        run: node scripts/fetch-office.mjs --required

      # WHY the opt-out (2026-09-10): a failed step skips every step after it, so one red Windows
      # test on master meant NO Windows installer at all, and an installer-icon test had to push a
      # throwaway branch with this step deleted. Windows-only, off unless someone asks for it.
      - name: Run tests
        if: ${{ !(inputs.skip_windows_tests && matrix.name == 'windows') }}
        run: npm test

      # Must run BEFORE the build — electron-builder's deb/rpm/pacman packagers
      # run inside `npm run build`. See desktop-ci.yml for the PR #98 backstory.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # `apt-get update` prefix: the cached package index on ubuntu-latest
        # often points to .deb versions that have rolled off the mirror, so
        # a bare install hits HTTP 404 / exit 100. Refresh the index first.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
        working-directory: .

      # Keep these three Windows-signing steps and the Build/verify pair in sync with
      # desktop-release.yml. Fails loudly when the environment's variables are
      # missing: an unsigned installer must never ship as if it were signed.
      - name: Check Windows signing is configured
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::The windows-signing environment is missing AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID, so the Windows installer cannot be signed. See docs/build-and-release.md (youcoded-dev) → Windows signing."
            exit 1
          fi

      - name: Sign in to Azure for Windows signing
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # WHY fetch the signing token here: GitHub's sign-in token is only good for a few
      # minutes, and electron-builder asks Azure for a signing token only when it
      # reaches the first file. Fetching it now caches it in the Azure CLI (about an
      # hour), which the signing module reuses for every file.
      - name: Fetch the Windows signing token
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: az account get-access-token --scope https://codesigning.azure.net/.default -o none

      - name: Build signed Mac installers
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          YOUCODED_BUILD_CHANNEL: BETA
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/youcoded-apple-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          # WHY a file: electron-builder/notarytool expect APPLE_API_KEY to be a
          # path, not base64. Keep it outside the checkout and artifact globs.
          node -e 'for (const k of ["CSC_LINK","CSC_KEY_PASSWORD","APPLE_API_KEY_BASE64","APPLE_API_KEY_ID","APPLE_API_ISSUER","APPLE_TEAM_ID"]) { if (!process.env[k]) throw new Error(k + " is missing from macos-signing"); } require("fs").writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_BASE64,"base64"), {mode:0o600,flag:"wx"});'
          npm run build -- --config electron-builder.mac-sign.yml
          node scripts/notarize-mac-installers.mjs release

      - name: Remove Apple API key
        if: always() && env.SIGN_MACOS == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/youcoded-apple-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.p8"

      - name: Build
        if: env.SIGN_MACOS != 'true'
        # Vite bakes this into __BUILD_CHANNEL__, which renders the "(BETA)" tag
        # in Settings → About. Release builds never set it, so they render clean.
        env:
          YOUCODED_BUILD_CHANNEL: BETA
        shell: bash
        run: |
          if [ "$SIGN_WINDOWS" = "true" ]; then
            # WHY a second config: see electron-builder.win-sign.yml. `--` hands the flag
            # to the electron-builder call that ends the build script.
            npm run build -- --config electron-builder.win-sign.yml
          else
            npm run build
          fi

      # WHY: a build can finish with a file silently left unsigned. Windows' own check
      # is the verdict: the installer and the app it installs must both carry a
      # valid signature, or the release is held back.
      - name: Verify the Windows installer is signed
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-ChildItem release/*.exe) + @(Get-Item release/win-unpacked/YouCoded.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            Write-Host "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { Write-Error 'A Windows file is not validly signed.'; exit 1 }

      # WHY: electron-builder SILENTLY skips macOS signing when it cannot sign, and a
      # Dependabot bump did exactly that on 2026-07-23 - six weeks of unopenable Mac
      # builds with every check green. The script (shared with the other mac workflow,
      # so betas and releases are held to one standard) explains the rest.
      - name: Verify the macOS bundle is signed
        if: matrix.name == 'macos'
        shell: bash
        run: bash scripts/verify-mac-signature.sh

      # WHY (final review, 2026-09-30): nothing else ever runs the Office converter INSIDE the
      # packaged app — the copy electron-builder re-signed, and for the Intel dmg one from a
      # different bundle than this runner's. This checks each app's x2t and dylibs are for its
      # dmg's CPU, then opens, saves and exports a docx as PDF with them through the app's own
      # x2t code (dist/main/office/x2t.js). The Intel copy runs under Rosetta when the runner has it.
      - name: Run the packaged Office converter
        if: matrix.name == 'macos'
        shell: bash
        run: node scripts/office-packaged-smoke.mjs release

      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
        working-directory: .

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/smoke-test.js
          else
            node scripts/smoke-test.js
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: youcoded-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # Signs this beta's installers with the release key exactly as a tagged release
  # is signed, and checks the result against the public key built into the app.
  # WHY (2026-09-11): the key otherwise runs only at release time, so a wrong or
  # missing UPDATE_SIGNING_KEY secret would first show up as the full release's
  # Update button refusing to install for everyone on a 1.3 beta. Running it on
  # each beta proves the secret long before that, and the two files it makes can
  # be attached to the beta pre-release so its downloads can be checked too.
  # Master only: a build of some other branch should not carry the release key's
  # signature.
  sign:
    needs: [build, version]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: artifacts
          pattern: youcoded-desktop-*

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22

      - name: Sign and verify the manifest
        working-directory: desktop
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          BETA_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set, so a tagged release would ship with nothing the in-app Update button accepts."
            exit 1
          fi
          node scripts/generate-release-manifest.mjs --dir "$GITHUB_WORKSPACE/artifacts" \
            --version "$BETA_VERSION" \
            --verify-with src/main/update-signing-key.ts

      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: youcoded-release-manifest
          path: |
            artifacts/youcoded-release.json
            artifacts/youcoded-release.json.sig
          retention-days: 7
