name: iOS TestFlight

# Builds the iPhone app for real iPhones, signs it with the company's Apple account and uploads it to TestFlight
# (Apple's own way to put a not-yet-released app on a phone). Nothing here runs by itself.
#
# How to ask for a build:
#   - "Run workflow" on this page (once this file is on master), or
#   - before that, on the branch named below: change the one line in ios/TESTFLIGHT_BUILD and push.
#
# What must be true first (none of it can be done from this repository):
#   1. The app exists in App Store Connect with the bundle id com.youcoded.app (a one-time form on Apple's site).
#   2. The Apple API key in the `macos-signing` environment may create signing certificates and upload builds
#      (its role must be Admin or App Manager).
#   3. The `macos-signing` environment allows the branch this runs from (today: master and v* tags only).
on:
  workflow_dispatch:
  push:
    branches: ['session/89-iphone-app']
    paths: ['ios/TESTFLIGHT_BUILD']

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build, sign and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    # The same protected environment as the Mac app's signing: the Apple API key lives there and nowhere else.
    environment: macos-signing
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Apple requires every upload of one version to carry a higher build number than the last.
      YOUCODED_IOS_BUILD_NUMBER: ${{ github.run_number }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            ios/runtime/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the page, the backend bundle and the Xcode project
        run: bash ios/build-resources.sh
      - name: Archive, sign and upload
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for k in APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [ -n "${!k:-}" ] || { echo "$k is missing from the macos-signing environment" >&2; exit 1; }
          done
          # WHY a file, removed when the step ends: Xcode reads the key from a path. It is written with a private
          # mode into the runner's own temp folder, and never echoed.
          KEY="$RUNNER_TEMP/youcoded-apple-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.p8"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY")
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")

          xcodebuild archive \
            -project ios/YouCoded.xcodeproj -scheme YouCoded -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YouCoded.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" | tail -40

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YouCoded.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          echo "Uploaded build $YOUCODED_IOS_BUILD_NUMBER. It appears in TestFlight after Apple finishes processing it (usually 10-30 minutes)."
