# Daily check: do the outside services the app depends on still answer? (.github/real-app/outside-services.mjs)
# WHY daily and separate: these break with no code change from us (the games server vanished unnoticed in 2026).
# A failure turns the run red and GitHub emails the repo owner, like the other scheduled checks.
name: Daily — outside services answer
on:
  schedule:
    - cron: '53 10 * * *'   # off the hour on purpose (GitHub delays :00 cron under load)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      # WHY pinned to a commit (desktop-ci.test.ts): a moved tag cannot swap the code a workflow runs; same versions as the other workflows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { sparse-checkout: .github/real-app }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with: { node-version: '22' }
      - run: node .github/real-app/outside-services.mjs
