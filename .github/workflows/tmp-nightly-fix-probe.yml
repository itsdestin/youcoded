# TEMPORARY: proves three nightly fixes on real Windows/macOS. Removed in the final commit.
name: tmp-nightly-fix-probe
on:
  push:
    branches: [session/nightly-test-fixes]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/exists-probe.test.ts tests/artifacts/sidecar-cleanup.test.ts tests/artifacts/resolve-artifact-path.test.ts
