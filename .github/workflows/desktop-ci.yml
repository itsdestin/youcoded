name: Desktop CI

on:
  # WHY: every PR gets a result, including docs-only and arbitrary branch names.
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Full checks, or focused cross-platform browser diagnostics'
        type: choice
        options: [all, browser]
        default: all

permissions:
  contents: read
# WHY: only a newer run of this PR supersedes it. The reusable Android child
# deliberately has NO concurrency group: github.workflow there is this caller.
concurrency:
  group: full-app-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.filter.outputs.route }}
      sha: ${{ steps.filter.outputs.sha }}
      matrix: ${{ steps.filter.outputs.matrix }}
      packageMode: ${{ steps.filter.outputs.packageMode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: filter
        run: node scripts/ci-policy.mjs changes

  tests:
    needs: changes
    if: needs.changes.outputs.route == 'full'
    name: tests (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # WHY: retain OS-specific semantic checks, once per selected OS, without
      # forcing every shard to wait for a global semantic-check matrix.
      - name: OS semantic checks
        if: matrix.shard == 1 && runner.os != 'Linux'
        run: |
          node --test ../scripts/beta-version.test.mjs ../scripts/ci-policy.test.mjs ../scripts/ci-evidence.test.mjs ../scripts/ci-linux.test.mjs ../scripts/ci-inputs.test.mjs ../scripts/ci-desktop.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run knip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint:design
        shell: pwsh
      - name: Run tests
        run: node ../scripts/ci-desktop.mjs shard "${{ matrix.os }}" "${{ matrix.shard }}" "${{ matrix.total }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.shard }}
          path: ci-results/tests-${{ matrix.os }}-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: changes
    if: needs.changes.outputs.route == 'full'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test beta version numbering
        run: node --test ../scripts/beta-version.test.mjs
      - name: Ensure prepared transport tool
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - name: Test CI policy and evidence
        run: node --test ../scripts/ci-policy.test.mjs ../scripts/ci-evidence.test.mjs ../scripts/ci-linux.test.mjs ../scripts/ci-inputs.test.mjs
      - run: npm ci
      - name: Test actual current Vitest discovery and shards
        run: node --test ../scripts/ci-desktop.test.mjs
      - name: Type check (tsgo)
        run: npm run typecheck
      - name: Dead-code check (knip)
        run: npm run knip
      - name: Lint (oxlint)
        run: npm run lint
      - name: Design lint (oxlint, ratchet)
        run: npm run lint:design
      - name: Prepare current production app
        env:
          CI_PACKAGE_MODE: ${{ needs.changes.outputs.packageMode }}
        run: node ../scripts/ci-linux.mjs prepare
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-app
          path: ci-prepared/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-evidence
          path: ci-results/prepared-evidence/
          if-no-files-found: error
          retention-days: 7

  formats:
    needs: [changes, prepare]
    if: needs.changes.outputs.route == 'full'
    name: Linux package (${{ matrix.format }})
    strategy:
      fail-fast: false
      matrix:
        format: [AppImage, deb, rpm, pacman]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd time
      - uses: actions/download-artifact@v8
        with:
          name: prepared-app
          path: ci-prepared
      - name: Package and validate current payload
        env:
          CI_PACKAGE_MODE: ${{ needs.changes.outputs.packageMode }}
        run: node scripts/ci-linux.mjs package "${{ matrix.format }}"
      # WHY: installers are validated here but not uploaded by default. Keep
      # current manifests, package metadata and sizes, not four duplicate blobs.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: format-${{ matrix.format }}
          path: ci-results/format-${{ matrix.format }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  android:
    needs: changes
    if: needs.changes.outputs.route == 'full'
    uses: ./.github/workflows/android-ci.yml

  evidence:
    needs: [changes, tests, prepare, formats]
    if: needs.changes.outputs.route == 'full'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      packageMode: ${{ steps.verify.outputs.packageMode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: tests-*
          path: ci-results
      - uses: actions/download-artifact@v8
        with:
          pattern: format-*
          path: ci-results
      - uses: actions/download-artifact@v8
        with:
          name: prepared-evidence
          path: ci-results/prepared-evidence
      - name: Verify fresh selected file union and package evidence
        id: verify
        env:
          CI_PACKAGE_MODE: ${{ needs.changes.outputs.packageMode }}
        run: node scripts/ci-desktop.mjs aggregate
      - uses: actions/upload-artifact@v7
        with:
          name: full-ci-summary
          path: ci-results/summary.json
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: changes
    if: needs.changes.outputs.route == 'browser'
    name: browser diagnostics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test beta version numbering
        run: node --test ../scripts/beta-version.test.mjs
      - run: npm ci
      - name: Type check (tsgo)
        run: npm run typecheck
      - name: Browser diagnostics
        env:
          DEBUG: 'pw:protocol,pw:browser*'
        run: npx vitest run tests/assistant-browser.test.ts tests/assistant-browser-host.test.ts tests/assistant-browser-live.test.ts tests/assistant-browser-native.test.ts tests/aria-props.test.ts tests/desktop-ci.test.ts --maxWorkers=1
      - name: Dead-code check (knip)
        run: npm run knip
      - name: Lint (oxlint)
        run: npm run lint
      - name: Design lint (oxlint, ratchet)
        run: npm run lint:design

  completion:
    # WHY: the stable required context includes Android and all current package
    # and file-union proofs. Browser diagnostics never receive this context.
    name: ${{ needs.changes.outputs.route == 'browser' && 'Full build not selected (browser diagnostics)' || 'build (ubuntu-latest)' }}
    needs: [changes, tests, prepare, formats, android, evidence, browser]
    if: always() && needs.changes.outputs.route != 'browser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require every selected result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.mjs gate

  browser-completion:
    name: Browser diagnostic completion
    needs: [changes, tests, prepare, formats, android, evidence, browser]
    if: always() && needs.changes.outputs.route == 'browser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.mjs gate
