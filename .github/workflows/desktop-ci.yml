name: Desktop CI

on:
  # Every PR is checked via `pull_request`, regardless of branch name. This
  # replaces the branch-name allowlist that caused the incident below: that
  # list was a proxy for "is this a PR", and the proxy failed when 'feat/**'
  # was listed but 'feature/**' matched nothing — so those branches and their
  # PRs got NO checks and master stayed red from 2026-07-14 to 07-16 (18
  # failing pushes) without anyone noticing. `pull_request` also lets
  # Dependabot's `dependabot/**` PRs run checks; they matched none of the old
  # push patterns. `push: [master]` keeps the post-merge run on master.
  # WHY: do not filter out docs-only runs at the trigger: that would omit the
  # required status entirely. The policy proves docs-only and the always-running
  # completion matrix still emits build (ubuntu-latest), including on failures.
  # PRs retain Linux coverage; master, nightly and manual runs retain all OSes.
  push:
    branches: [master]
  pull_request:
  schedule:
    # 07:23 UTC daily, off the hour on purpose (GitHub delays :00 cron under load).
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Full checks, or focused cross-platform browser diagnostics'
        type: choice
        options: [all, browser]
        default: all

# WHY: supersede only older runs of the same PR, never independent manual,
# nightly or master runs. Workflow namespace keeps Android cancellation separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only a proven nonempty docs-only diff skips the expensive jobs. Failures,
  # unknown events, empty diffs and mixed paths never mean docs-only success.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: filter
        run: node scripts/ci-policy.mjs changes

  # WHY: cheap checks gate both expensive lanes, which use independent checkouts.
  preflight:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Windows runs the TESTS only (not the packaging build) because a whole
    # class of bug is invisible on Linux: Git Bash path semantics, MSYS mounts,
    # drive-relative resolution, CRLF. This job was ubuntu-only, so PR #174's
    # scoped-cwd-persistence tests never ran on Windows and merged green while
    # broken there — first seen 2026-07-19, at BETA-BUILD time, because
    # desktop-test-build.yml was the only workflow with a Windows runner.
    strategy:
      fail-fast: false
      matrix:
        # macOS added 2026-07-19 for the same reason Windows was: its only
        # coverage was desktop-test-build.yml, so a macOS-only failure could
        # not surface until a beta dispatch — which is exactly how the
        # sync-spaces-engine 5s-ceiling timeouts were found (run 29701441150).
        # PRs: Linux only. Master pushes, the nightly and a manual dispatch: all three.
        # See the trigger comment above (2026-09-16).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # WHY: these dependency-free policies live outside Vitest's discovery root.
      - name: Test CI policy
        run: node --test ../scripts/ci-policy.test.mjs

      - name: Test beta version numbering
        run: node --test ../scripts/beta-version.test.mjs

      - name: Install dependencies
        run: npm ci

      # Type check BOTH trees (src + tests) with tsgo, TypeScript 7's native
      # compiler: ~3s together, where tsc took ~27s. Until now CI type-checked
      # src only as a side effect of `npm run build`, Linux-only and after the
      # tests — and never checked tests/ at all. Runs first so a type error
      # fails in seconds instead of after the suite. The build below still
      # compiles with TypeScript 6 (`tsc`), so an emit-only difference between
      # the two compilers cannot ship unnoticed.
      - name: Type check (tsgo)
        run: npm run typecheck

      # Dead-code check. Deliberately a SEPARATE step rather than chained onto
      # `npm test` — that script is bare `vitest` (watch-capable), so chaining
      # would re-run knip on every file save in the local dev loop.
      # Gates only on the categories that are clean today (see desktop/knip.jsonc
      # → "rules"); the noisy-but-real ones report as warnings and exit 0, so
      # this ratchets without demanding a big-bang cleanup first.
      - name: Dead-code check (knip)
        run: npm run knip

      # Bug gate, not a style gate. tsc + vitest + knip were all green while a
      # conditional React hook, a floating promise in main, and a runtime import
      # of an undeclared package shipped — none of those tools can see those
      # classes. Every enabled rule is at zero on the tree, so this fails only on
      # a NEW defect. Rule set and the measured cost of each deferred rule:
      # desktop/.oxlintrc.json (oxlint replaced ESLint 2026-09-14, same rules).
      - name: Lint (oxlint)
        run: npm run lint

      # Design-system lint as a RATCHET, not a gate at zero (2026-09-16). The
      # script carries `--max-warnings <count measured that day>` (see
      # desktop/package.json), so this fails only when a change ADDS a raw
      # colour, an arbitrary value or a restyled components/ui primitive. Lower
      # the number in package.json whenever a cleanup brings the count down;
      # never raise it. Before this step the check had zero callers and the
      # count grew unseen.
      - name: Design lint (oxlint, ratchet)
        run: npm run lint:design

  tests:
    needs: [changes, preflight]
    if: needs.changes.outputs.code == 'true' && needs.preflight.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        if: inputs.test_scope != 'browser'
        run: npm test
      # WHY: diagnostics retain the full suite's inherited shell, but can never
      # produce the protected full-build status or trigger installer packaging.
      - name: Browser diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'browser'
        env:
          DEBUG: 'pw:protocol,pw:browser*'
        run: npx vitest run tests/assistant-browser.test.ts tests/assistant-browser-host.test.ts tests/assistant-browser-live.test.ts tests/assistant-browser-native.test.ts tests/aria-props.test.ts tests/desktop-ci.test.ts --maxWorkers=1

  # WHY: package in parallel with tests, on its own pristine checkout and deps.
  # Never consume files generated or mutated by a test matrix leg.
  package:
    needs: [changes, preflight]
    if: needs.changes.outputs.code == 'true' && needs.preflight.result == 'success' && inputs.test_scope != 'browser'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Must run BEFORE the build — electron-builder's deb/rpm/pacman packagers
      # run inside `npm run build` (see desktop/electron-builder.yml linux.target).
      # PR #98 added rpm + pacman targets without updating CI, so every Desktop
      # CI run since 2026-05-20 (commit 4679cc89) has been red on the same
      # bsdtar-missing failure. Mirror desktop-release.yml's setup step:
      #   libarchive-tools -> provides bsdtar, required by the pacman target
      #   rpm              -> required by the rpm target
      # Packaging is Linux-only here: the deb/rpm/pacman targets are what CI
      # regressed on before, and the Windows NSIS build is already covered by
      # desktop-test-build.yml / desktop-release.yml. Windows stops after tests.
      - name: Install Linux build deps
        # apt-get update prefix: the cached package index on ubuntu-latest
        # frequently points to .deb versions that have already rolled off
        # the mirror, so a bare `install` fails with HTTP 404 / exit 100.
        # Refresh the index first.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
        working-directory: .

      - name: Build
        run: npm run build

  # WHY: the required context must expand its matrix even after failed/skipped
  # dependencies. Only the executable exact-result gate can mark it successful.
  build:
    name: ${{ inputs.test_scope == 'browser' && format('browser diagnostics ({0})', matrix.os) || format('build ({0})', matrix.os) }}
    needs: [changes, preflight, tests, package]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify completion
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_TEST_SCOPE: ${{ inputs.test_scope }}
        run: node scripts/ci-policy.mjs gate
