# TEMPORARY (card #247) — removed again before this branch is reviewed.
# WHY: the rpm built on ubuntu-26.04 failed its unpack check. This builds the real rpm on both
# 24.04 and 26.04, records what differs, and tries a real install inside Fedora-family containers,
# so "does it install on Fedora" is answered by an install rather than by reading.
name: tmp 247 rpm probe
on:
  push:
    branches: ['session/247-linux-release-build']
    paths: ['.github/workflows/tmp-247-rpm-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd xz-utils
      - name: Tool versions
        run: |
          rpm --version; rpmbuild --version; bsdtar --version
          echo "rpmformat macro: [$(rpm --eval '%{?_rpmformat}')]"
          echo "payload macro: [$(rpm --eval '%{?_binary_payload}')]"
      - name: Build rpm (as the release does)
        run: npm run build -- --linux rpm --publish never
      - name: Build rpm (forced old v4 format)
        continue-on-error: true
        run: npx electron-builder --linux rpm --publish never -c.directories.output=release-v4 -c.rpm.fpm=--rpm-rpmbuild-define -c.rpm.fpm="_rpmformat 4"
      - name: Inspect and install
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pkg
          cp release/*.rpm /tmp/pkg/default.rpm
          cp release-v4/*.rpm /tmp/pkg/v4.rpm 2>/dev/null
          cat > /tmp/payload.py <<'PY'
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          off = 96
          for i in range(2):
              assert d[off:off+3] == b'\x8e\xad\xe8', 'bad header magic'
              n, h = struct.unpack('>II', d[off+8:off+16])
              off += 16 + 16*n + h
              if i == 0: off = (off + 7) // 8 * 8
          open(sys.argv[2], 'wb').write(d[off:off+4000000])
          print('lead major.minor:', d[4], d[5], 'payload offset:', off)
          PY
          for f in /tmp/pkg/*.rpm; do
            echo "=================== $f"
            ls -la "$f"; file "$f"
            rpm -qp --qf 'built by rpm: %{RPMVERSION}\npayload format: %{PAYLOADFORMAT}\ncompressor: %{PAYLOADCOMPRESSOR} %{PAYLOADFLAGS}\n' "$f"
            rpm -qp --qf 'RPMFORMAT tag: %{RPMFORMAT}\n' "$f"
            rpm -qp --requires "$f"
            rpmkeys -Kv "$f"
            python3 /tmp/payload.py "$f" /tmp/payload.bin; file /tmp/payload.bin
            echo -n "first bytes of the unpacked payload: "; (xz -dc /tmp/payload.bin 2>/dev/null || zstd -dc /tmp/payload.bin 2>/dev/null || gzip -dc /tmp/payload.bin 2>/dev/null) | head -c 6; echo
            echo -n "bsdtar direct: "; bsdtar -tf "$f" 2>&1 | tail -1; echo "bsdtar direct exit ${PIPESTATUS[0]}"
            echo -n "rpm2cpio | bsdtar files: "; rpm2cpio "$f" | bsdtar -tf - 2>&1 | wc -l
          done
          DNF='rpm --version; dnf install -y /pkg/P >/tmp/l 2>&1; rc=$?; tail -12 /tmp/l; if [ $rc -ne 0 ]; then echo "--- dnf failed, trying rpm -i --nodeps"; rpm -ivh --nodeps /pkg/P; echo "nodeps exit $?"; fi; rpm -q youcoded; ls -la /opt/YouCoded/youcoded; rpm -V youcoded | head -5; exit $rc'
          ZYP='rpm --version; zypper --non-interactive --no-gpg-checks install /pkg/P >/tmp/l 2>&1; rc=$?; tail -12 /tmp/l; if [ $rc -ne 0 ]; then echo "--- zypper failed, trying rpm -i --nodeps"; rpm -ivh --nodeps /pkg/P; echo "nodeps exit $?"; fi; rpm -q youcoded; ls -la /opt/YouCoded/youcoded; exit $rc'
          echo "| built on | package | system | result |" >> /tmp/table; echo "|---|---|---|---|" >> /tmp/table
          for p in default.rpm v4.rpm; do
            [ -f /tmp/pkg/$p ] || continue
            for img in fedora:latest fedora:42 fedora:41 rockylinux:9 almalinux:8 opensuse/leap:15.6 opensuse/tumbleweed; do
              echo "=================== install $p on $img"
              case "$img" in opensuse*) cmd="${ZYP//P/$p}";; *) cmd="${DNF//P/$p}";; esac
              docker run --rm -v /tmp/pkg:/pkg:ro "$img" sh -c "$cmd"; rc=$?
              echo "RESULT $p on $img: exit $rc"
              echo "| ${{ matrix.os }} | $p | $img | $([ $rc -eq 0 ] && echo installed || echo "FAILED ($rc)") |" >> /tmp/table
            done
          done
          cat /tmp/table; cat /tmp/table >> "$GITHUB_STEP_SUMMARY"
          exit 0
