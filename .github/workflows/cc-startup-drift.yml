name: Claude Code startup-dialog drift

# Has the LATEST published Claude Code changed the dialogs it shows before a
# session starts (folder trust, bypass warning, MCP-server approval) and the
# FIRST-INSTALL screens a brand-new install sees (theme picker, sign-in method
# choice; recorded signed-out and never answered)?
#
# WHY: each time Claude Code reshaped one of these (the 2.1.2xx trust rewrite,
# 2.1.281 dropping the option numbers), new YouCoded sessions sat on
# "Initializing session..." until someone noticed by hand. This installs
# npm's latest @anthropic-ai/claude-code, captures every startup dialog in a
# throwaway home folder, compares them with the saved captures, and replays
# them through the app's own parser (desktop/test-conpty/check-startup-drift.mjs).
#
# Needs NO secrets and costs nothing: every dialog it checks appears before
# sign-in, and no scenario sends a message to a model. A failure only turns
# this run red and writes what changed to the run's summary page; it opens no
# issue and comments on nothing.
on:
  schedule:
    # 08:41 UTC daily, off the hour on purpose (GitHub delays :00 cron under load).
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      # No token left in .git/config: the job then runs an untrusted package
      # (npm's latest Claude Code) and nothing it starts should find one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # No `cache: npm`: this job installs and runs an untrusted package, and
      # the npm cache is shared with the build workflows — a poisoned cache
      # entry must never be able to reach them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22

      # Only node-pty and @xterm/headless are needed; Electron's ~100 MB
      # runtime is not, so its download is skipped.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # One retry before deciding: a slow runner can miss a deadline once; a real change fails both runs the same way.
      # The verdict (ok / changed / broken / check-failed) goes to the alert job; exit codes are in the script's header.
      - name: Compare the latest Claude Code's startup dialogs with the saved ones
        id: check
        run: |
          set +e
          node test-conpty/check-startup-drift.mjs --latest --app; code=$?
          case "$code" in 0|3) ;; *)
            echo "::warning::First run ended with code $code — retrying once to rule out a flake."
            node test-conpty/check-startup-drift.mjs --latest --app; code=$? ;;
          esac
          [ "$code" = 0 ] && { echo "verdict=ok" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$code" = 3 ] && { echo "verdict=changed" >> "$GITHUB_OUTPUT"; echo "::warning::Claude Code changed, but the app still reads every screen — no alert. Refresh the saved captures (node test-conpty/check-startup-drift.mjs --app --save)."; exit 0; }
          [ "$code" = 1 ] && { echo "verdict=broken" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "verdict=check-failed" >> "$GITHUB_OUTPUT"; exit 1

  # Ping Destin's phone through the shared alert (.github/actions/drift-alert): when users are affected (new, or a
  # repeat saying how long it has lasted), once when that clears, and when the check itself broke. Harmless changes
  # send nothing. WHY its own job: the job above runs an untrusted package and is given no secrets on purpose; this one
  # runs only that action from the repository. Silent when the NTFY_TOPIC secret is not set.
  alert:
    needs: drift
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read    # this workflow's run history: a new problem, or day N of the same one
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/drift-alert
      - uses: ./.github/actions/drift-alert
        with:
          verdict: ${{ needs.drift.outputs.verdict }}
          check-name: startup screens
          workflow-file: cc-startup-drift.yml
          broken-title: "YouCoded: new chats may not start"
          broken-body: "The newest Claude Code changed a first-run or startup screen that YouCoded can no longer read: new users or new chats may get stuck. YouCoded needs an update."
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          github-token: ${{ github.token }}
