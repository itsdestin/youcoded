name: Claude Code startup-dialog drift

# Has the LATEST published Claude Code changed the dialogs it shows before a
# session starts (folder trust, bypass warning, MCP-server approval)?
#
# WHY: each time Claude Code reshaped one of these (the 2.1.2xx trust rewrite,
# 2.1.281 dropping the option numbers), new YouCoded sessions sat on
# "Initializing session..." until someone noticed by hand. This installs
# npm's latest @anthropic-ai/claude-code, captures every startup dialog in a
# throwaway home folder, compares them with the saved captures, and replays
# them through the app's own parser (desktop/test-conpty/check-startup-drift.mjs).
#
# Needs NO secrets and costs nothing: every dialog it checks appears before
# sign-in, and no scenario sends a message to a model. A failure only turns
# this run red and writes what changed to the run's summary page; it opens no
# issue and comments on nothing.
on:
  schedule:
    # 08:41 UTC daily, off the hour on purpose (GitHub delays :00 cron under load).
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      # No token left in .git/config: the job then runs an untrusted package
      # (npm's latest Claude Code) and nothing it starts should find one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # No `cache: npm`: this job installs and runs an untrusted package, and
      # the npm cache is shared with the build workflows — a poisoned cache
      # entry must never be able to reach them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22

      # Only node-pty and @xterm/headless are needed; Electron's ~100 MB
      # runtime is not, so its download is skipped.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # One retry before failing: a single slow start (network, a cold npm
      # registry) must not send a red "something changed" email. A real change
      # fails both runs the same way.
      - name: Compare the latest Claude Code's startup dialogs with the saved ones
        run: |
          node test-conpty/check-startup-drift.mjs --latest --app && exit 0
          echo "::warning::First run reported a difference or failed — retrying once to rule out a flake."
          node test-conpty/check-startup-drift.mjs --latest --app

  # Ping Destin's phone when the check above ends red (final review F-2, 2026-11-09: "piggyback on" the drift watch).
  # WHY its own job: the job above runs an untrusted package and is given no secrets on purpose. This one runs no
  # code from the repository or from npm, only one request. The message carries no details (anyone who knows the
  # channel's name can read it); the run's summary page has them. Silent when the NTFY_TOPIC secret is not set.
  alert:
    needs: drift
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Tell Destin's phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set; the red run is the only notice."; exit 0; fi
          curl -fsS -H "Title: YouCoded: Claude Code changed" -H "Priority: high" -H "Tags: warning" -H "Click: $RUN_URL" \
            -d "The newest Claude Code changed its first-run or startup screens. YouCoded may need an update before people hit it. Tap to open the run." \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
