name: iOS CI

# The iPhone app: builds it on a Mac, runs its unit tests and starts the whole app in an iPhone simulator
# (ios/YouCodedUITests). WHY its own workflow, not a job inside Desktop CI yet: the iPhone app is new and unreleased
# (card #89); while it is being built it runs only where its own files change, so a problem here cannot hold up a
# desktop or Android change. Fold it into ci-policy.mjs routing when the app ships.
on:
  push:
    branches: [master, 'session/89-iphone-app']
    paths:
      - 'ios/**'
      - 'desktop/src/main/headless/**'
      - 'desktop/src/shared/android-page-origin.ts'
      - 'desktop/src/shared/capabilities.ts'
      - 'desktop/src/renderer/android-page.ts'
      - 'desktop/package-lock.json'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and start in a simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      YOUCODED_IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            ios/runtime/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head -20
      - name: Build the page, the backend bundle and the Xcode project
        run: bash ios/build-resources.sh
      - name: Pick a simulator
        id: sim
        run: |
          # The newest "Pro Max" the runner has (the owner's phone is an iPhone 15 Pro Max); any iPhone otherwise.
          NAME="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+ Pro Max' | sort -V | tail -1)"
          [ -n "$NAME" ] || NAME="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9A-Za-z ]+' | head -1 | sed 's/ *$//')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"
      # WHY signed "to run locally" (identity "-") rather than unsigned: the iPhone's Keychain refuses an app with no
      # signature at all, and the app keeps its secrets key there, so an unsigned build can only show "couldn't start".
      # This signature needs no Apple account and is what Xcode itself uses for a simulator.
      - name: Build, unit-test and start the app
        run: |
          mkdir -p "$RUNNER_TEMP/ios-shots"
          set -o pipefail
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/ios-shots" xcodebuild test \
            -project ios/YouCoded.xcodeproj -scheme YouCoded \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath "$RUNNER_TEMP/ios-result.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -vE '^\s*(CompileC|SwiftCompile|SwiftDriver|Ld|CodeSign|ProcessInfoPlistFile|CpResource|Copy|builtin-|cd |export |/Applications/Xcode|\s*$)' | tail -400
      - name: Collect the app's logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ios-logs"
          # WHY a search, not `simctl get_app_container booted`: xcodebuild may run the tests on a CLONE of the
          # simulator, which is not the "booted" device by the time this step runs.
          n=0
          find "$HOME/Library/Developer/CoreSimulator/Devices" \( -name 'backend*.log' -o -name 'page.log' \) -path '*userdata*' 2>/dev/null | while read -r f; do
            n=$((n+1)); cp "$f" "$RUNNER_TEMP/ios-logs/$n-$(basename "$f")"
          done
          # Crash reports, if the app ended unexpectedly.
          find "$HOME/Library/Logs/DiagnosticReports" -name 'YouCoded*' -mmin -90 2>/dev/null | while read -r f; do cp "$f" "$RUNNER_TEMP/ios-logs/"; done
          tail -c 400000 "$RUNNER_TEMP/xcodebuild.log" > "$RUNNER_TEMP/ios-logs/xcodebuild-tail.log" 2>/dev/null || true
          for dev in $(xcrun simctl list devices | grep -E 'Booted' | grep -oE '[0-9A-F-]{36}'); do
            xcrun simctl spawn "$dev" log show --last 20m --predicate 'process == "YouCoded"' --style compact 2>/dev/null | tail -c 600000 > "$RUNNER_TEMP/ios-logs/unified-$dev.log" || true
          done
          ls -la "$RUNNER_TEMP/ios-logs" "$RUNNER_TEMP/ios-shots" || true
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ios-simulator-run
          path: |
            ${{ runner.temp }}/ios-shots
            ${{ runner.temp }}/ios-logs
          if-no-files-found: warn
          retention-days: 7
