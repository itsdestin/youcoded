# Phase 0 trials for the real-app testing plan (youcoded-dev docs/active/plans/2026-11-01-real-app-testing.md).
# WHY on push to this one branch only: these are one-off experiments; they must never run on master or PRs.
# They use the released v1.3.3 downloads, exactly what users install.
name: Probe — phase 0 trials
on:
  push:
    branches: [session/test-suite-rethink]
    paths: ['.github/probes/**', '.github/workflows/probe-phase0.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  VER: v1.3.3

jobs:
  android-engine:
    name: Phone engine on free arm64 Linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Can this machine run a pretend phone? (needs /dev/kvm)
        run: |
          uname -m; nproc
          ls -l /dev/kvm && echo "KVM: PRESENT" || echo "KVM: ABSENT"
      - name: Run the released phone app's own engine
        run: |
          gh release download "$VER" -p 'YouCoded-*.apk' -D apk
          bash .github/probes/android-engine.sh apk/*.apk

  claude-code:
    name: Claude Code first run with a test key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i -g @anthropic-ai/claude-code@2.1.300
      - name: Walk the first-run screens and send one message
        env:
          ANTHROPIC_API_KEY: ${{ secrets.YOUCODED_TEST_ANTHROPIC_KEY }}
          ANTHROPIC_MODEL: claude-haiku-5-5   # cheapest model; this checks plumbing, not quality
          DISABLE_AUTOUPDATER: '1'
        run: python3 .github/probes/claude-first-run.py "$RUNNER_TEMP/project"

  install-windows:
    name: Install and open on Windows
    runs-on: windows-latest
    steps:
      - name: Download and silently install the real installer
        shell: pwsh
        run: |
          gh release download $env:VER -p 'YouCoded-Installer-*.exe' -D inst -R ${{ github.repository }}
          $exe = (Get-ChildItem inst\*.exe)[0].FullName
          Start-Process $exe -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles" -Recurse -Filter 'YouCoded.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { Write-Error 'installed YouCoded.exe not found'; exit 1 }
          "installed at $($app.FullName)"
          "APP=$($app.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Open it and wait for the first screen
        shell: pwsh
        run: |
          $env:YOUCODED_SMOKE_TEST = '1'
          $p = Start-Process $env:APP -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          foreach ($i in 1..60) { Start-Sleep 1; if ((Get-Content out.txt -Raw -ErrorAction SilentlyContinue) -match '\[smoke\] ready') { $ok = $true; break }; if ($p.HasExited) { break } }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size); $bmp.Save("$PWD\windows.png")
          Get-Content out.txt -Tail 20 -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content err.txt -Tail 30 -ErrorAction SilentlyContinue; Write-Error 'first screen never drew'; exit 1 }
          'PASS  window drew its first screen'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screen, path: windows.png, if-no-files-found: ignore }

  install-mac:
    name: Install and open on Mac
    runs-on: macos-latest
    steps:
      - name: Download and install from the real dmg
        run: |
          gh release download "$VER" -p 'YouCoded-Installer-*-arm64.dmg' -D inst -R ${{ github.repository }}
          hdiutil attach inst/*.dmg -nobrowse -mountpoint /Volumes/yc
          ls -la /Volumes/yc
          app=$(find /Volumes/yc -maxdepth 1 -name '*.app' | head -1)
          echo "found: $app"
          cp -R "$app" /Applications/
          echo "APP=/Applications/$(basename "$app")" >> "$GITHUB_ENV"
      - name: Open it and wait for the first screen
        run: |
          bin=$(find "$APP/Contents/MacOS" -type f -perm +111 | head -1); echo "binary: $bin"
          YOUCODED_SMOKE_TEST=1 "$bin" > out.txt 2> err.txt & pid=$!
          ok=0; for i in $(seq 1 60); do sleep 1; grep -q '\[smoke\] ready' out.txt && { ok=1; break; }; kill -0 $pid 2>/dev/null || break; done
          screencapture -x mac.png || true
          tail -20 out.txt
          [ $ok = 1 ] || { tail -30 err.txt; echo 'first screen never drew'; exit 1; }
          echo 'PASS  window drew its first screen'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mac-screen, path: mac.png, if-no-files-found: ignore }
