name: Android Test Build

on:
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Version PREFIX to stamp into the dogfood APKs. This workflow's run
          counter is appended automatically (e.g. 1.3.1-beta.12), and the build
          type adds its own suffix on top, so the APKs report
          1.3.1-beta.12-dev and 1.3.1-beta.12-releasetest. Leave it alone
          unless the release line changes (1.3.0-beta → 1.3.1-beta on
          2026-09-19: 1.3.0 is skipped as a release).
        required: false
        default: '1.3.1-beta'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # WHY (2026-09-13): this workflow never stamped a version, so its APKs
      # inherited the hand-set versionName in app/build.gradle.kts — `1.2.4`,
      # the May release — and every dogfood build reported itself to analytics
      # (AnalyticsService.kt sends BuildConfig.VERSION_NAME) as a 1.2.4 build.
      # A 1.3 beta then showed up in the version breakdown as last spring's
      # release. android-release.yml has stamped since 2026-09-10 and
      # desktop-test-build.yml since 2026-08-15; this was the last build path
      # that did not, which is exactly why it was the one telling lies.
      #
      # versionCode is deliberately NOT stamped. These APKs install as separate
      # apps (.dev / .releasetest), so Play never sees the number, and raising
      # it here would block installing a LOCAL build (still the hand-set 20)
      # over a CI one — Android refuses a lower versionCode. The analytics
      # problem is versionName's alone, so versionName is all this touches.
      - name: Stamp dogfood version
        shell: bash
        run: |
          NAME="${{ inputs.base }}.${{ github.run_number }}"
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${NAME}\"/" app/build.gradle.kts
          grep -nE 'versionCode|versionName' app/build.gradle.kts | head -2

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # build-web-ui.sh runs `npm run build` in desktop/, which invokes
      # electron-builder for all configured Linux targets. Pacman needs
      # bsdtar (libarchive-tools); rpm target needs the rpm package. See
      # android-ci.yml for the full backstory on the PR #98 regression.
      - name: Install Linux build deps
        # `apt-get update` prefix: the cached package index on ubuntu-latest
        # often points to .deb versions that have rolled off the mirror, so
        # a bare install hits HTTP 404 / exit 100. Refresh the index first.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      # Build the full React UI so the APK has a working WebView.
      # bundleWebUi (Gradle preBuild dep) would do this too, but running
      # it explicitly here keeps this workflow's intent self-documenting.
      - name: Build React UI
        run: ./scripts/build-web-ui.sh

      - name: Run unit tests
        run: ./gradlew test

      # Build BOTH flavors so manual artifact downloads cover the same
      # parity surface as the per-push CI. See android-ci.yml for the
      # rationale on why releaseTest belongs alongside debug.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build releaseTest APK (R8 minified, debug-signed)
        run: ./gradlew assembleReleaseTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-test-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload releaseTest APK
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-test-apk-releasetest
          path: app/build/outputs/apk/releaseTest/*.apk
          retention-days: 7
